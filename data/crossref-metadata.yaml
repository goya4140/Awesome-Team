    venue: Business, Management and Economics
    citation_count: 0
    abstract: 'This chapter investigates how academic branding can be systematically constructed through institutional design, using the Hong Kong University of Science and Technology (Guangzhou) as a case study. Branding at this startup university is not externally imposed but internally embedded across two interdependent domains: structural innovation and pedagogical co-creation. The university’s Hub-Thrust academic management framework replaces conventional departments with modular, problem-oriented units, articulating an interdisciplinary institutional identity. Pedagogically, students are positioned as co-creators of knowledge through early research immersion, cross-year mentorship schemes, and collaborative projects with faculty and industry. These mechanisms enact branding as both symbolic and functional. The model illustrates how education, scientific inquiry, and talent development are integrated as a unified institutional logic, which offers insights for universities seeking coherent, future-oriented branding strategies.'
