    venue: Scientific Works
    citation_count: 0
    abstract: This article discusses human skills. Skills are interpreted as actions that a person performs to acquire motor or intellectual abilities, carrying out those actions in the appropriate manner. It is shown that, alongside new skills, new knowledge and habits also emerge during the process of activity. Skills are formed through various activities in the learning process, such as work, tasks, games, exercises, tests, projects, etc. In the classification presented in the article, skills are divided into fields such as perception, learning, labor, or-ganization, communication, and so on. The psychophysiological characteristics of motor skills, which form the basis of other skills, are explained. It is stated that without motor skills, the development of other skills is impossible. The article also provides a classification of cognitive skills. A brief explanation is given for cognitive skills formed through the perception of sensory signals, attention, memory, thinking, speech, and other cognitive processes. Another issue highlighted is the relationship between cognitive skills and other psychological constructs that stimulate their application. It is noted that the social-cognitive skills include motivation, teamwork, self-regulation, organizational skills, goal setting, decision making, social intelligence, emotional intelligence, social role behavior, and so on. In conclusion, the important role of skills in human life and professional activity is emphasized.
