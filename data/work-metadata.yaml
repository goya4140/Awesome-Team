    catalog_title: 'Official repo for CVPR 2022 (Oral) paper: Revisiting the "Video" in Video-Language Understanding. Contains code for the Atemporal Probe (ATP).'
    catalog_url: https://github.com/StanfordVL/atp-video-language
    kind: open_source
    paper:
      title: Revisiting the "Video" in Video-Language Understanding
      url: https://arxiv.org/abs/2206.01720
      openalex_url: https://openalex.org/W4320086290
      year: 2022
      venue: arXiv (Cornell University)
      authors:
      - Shyamal Buch
      - Cristóbal Eyzaguirre
      - Adrien Gaidon
      - Jiajun Wu
      - Li Fei-Fei
      - Juan Carlos Niebles
      external_ids:
        ArXiv: '2206.01720'
        DOI: 10.48550/arxiv.2206.01720
        OpenAlex: https://openalex.org/W4320086290
    abstract: What makes a video task uniquely suited for videos, beyond what can be understood from a single image? Building on recent progress in self-supervised image-language models, we revisit this question in the context of video and language tasks. We propose the atemporal probe (ATP), a new model for video-language analysis which provides a stronger bound on the baseline accuracy of multimodal models constrained by image-level understanding. By applying this model to standard discriminative video and language tasks, such as video question answering and text-to-video retrieval, we characterize the limitations and potential of current video-language benchmarks. We find that understanding of event temporality is often not necessary to achieve strong or state-of-the-art performance, even compared with recent large-scale video-language models and in contexts intended to benchmark deeper video-level understanding. We also demonstrate how ATP can improve both video-language dataset and model design. We describe a technique for leveraging ATP to better disentangle dataset subsets with a higher concentration of temporally challenging data, improving benchmarking efficacy for causal and temporal understanding. Further, we show that effectively integrating ATP into full video-level temporal models can improve efficiency and state-of-the-art accuracy.
    summary: 该研究探讨了视频任务与单图的区别，提出了一个新的模型“时间点探针”（ATP），通过它发现理解事件时序性并不是必需条件来实现强或状态-of-the-art的性能。该模型可以改善视频语言数据集和模型设计，并且可以提高效率和性能。
    citation:
      source: Google Scholar
      source_url: https://scholar.google.com/scholar?hl=en&q=%22Revisiting+the+%22Video%22+in+Video-Language+Understanding%22
      verification_status: search_link_only
    metadata_provenance:
      identity_and_abstract: OpenAlex
      openalex_url: https://openalex.org/W4320086290
    code_impact:
      github_stars: 51
      checked_at: '2026-07-28'
    resolution_status: resolved
    figure:
      image_url: https://ar5iv.labs.arxiv.org/html/2206.01720/assets/figures/fig4.png
      caption: 'Figure 4 : Improving temporal modeling with ATP. In our Section  4.3 case study, we make use of learned single-embedding ATP selectors to improve temporal modeling. Intuitively, ATP learns to surface frames rich in single event-level information. Building upon this, we propose a simple approach to partition the original video and run (a now frozen ) ATP on each part. These per-partition selection outputs are then useful candidates for a separate downstream learnable model to perform temporal reasoning and output a video-level embedding for the final video-language task.'
