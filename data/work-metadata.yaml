      external_ids:
        ArXiv: '2412.01506'
        DOI: 10.48550/arxiv.2412.01506
        OpenAlex: https://openalex.org/W4405034976
    abstract: We introduce a novel 3D generation method for versatile and high-quality 3D asset creation. The cornerstone is a unified Structured LATent (SLAT) representation which allows decoding to different output formats, such as Radiance Fields, 3D Gaussians, and meshes. This is achieved by integrating a sparsely-populated 3D grid with dense multiview visual features extracted from a powerful vision foundation model, comprehensively capturing both structural (geometry) and textural (appearance) information while maintaining flexibility during decoding. We employ rectified flow transformers tailored for SLAT as our 3D generation models and train models with up to 2 billion parameters on a large 3D asset dataset of 500K diverse objects. Our model generates high-quality results with text or image conditions, significantly surpassing existing methods, including recent ones at similar scales. We showcase flexible output format selection and local 3D editing capabilities which were not offered by previous models. Code, model, and data will be released.
    summary: 我们提出了一种新颖的3D生成方法，旨在为多样化和高质量的3D资产创造。该方法基于统一的结构性LAT（SLAT）表示形式，可以解码不同输出格式，如辐射场、3D高斯分布和网格。这种方法通过整合稀疏的3D网格与从强大视觉基础模型中提取的密集多视图视觉特征，有效地捕捉了结构（几何）和表面（颜色）信息，同时保持解码灵活性。我们使用适应SLAT的直角流转器为3D生成模型，并在500K多样化对象的大型3D资产数据集上训练模型，达到2亿参数的最大值。我们的模型在文本或图像条件下产生高质量结果，远超现有方法，包括最近的方法。我们展示了可选择输出格式和局部3D编辑能力，这些功能不被之前
    citation:
      source: Google Scholar
      source_url: https://scholar.google.com/scholar?hl=en&q=%22Structured+3D+Latents+for+Scalable+and+Versatile+3D+Generation%22
      verification_status: search_link_only
    metadata_provenance:
      identity_and_abstract: OpenAlex
      openalex_url: https://openalex.org/W4405034976
    code_impact:
      github_stars: 13317
      checked_at: '2026-07-28'
    resolution_status: resolved
    figure:
      image_url: https://ar5iv.labs.arxiv.org/html/2412.01506/assets/x2.png
      caption: 'Figure 2 : Overview of our method. Encoding & Decoding: We adopt a structured latent representation ( SLat ) for 3D assets encoding, which defines local latents on a sparse 3D grid to represent both geometry and appearance information. It is encoded from the 3D assets by fusing and processing dense multiview visual features extracted from a DINOv2 encoder, and can be decoded into versatile output representations with different decoders. Generation: Two specialized rectified flow transformers are utilized to generate SLat , one for the sparse structure and the other for local latents attached to it.'
      source_page: https://arxiv.org/abs/2412.01506
      source_kind: 原论文流程 / 方法图（通过 ar5iv 渲染）
      selection_score: 6
