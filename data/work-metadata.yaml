      caption: 'Figure 3 : Model overview. Our model outputs an inpainted image given the mask and masked image input. Firstly, we downsample the mask to accommodate the size of the latent, and input the masked image to the VAE encoder to align the distribution of latent space. Then, noisy latent, masked image latent, and downsampled mask are concatenated as the input of BrushNet . The feature extracted from BrushNet  is added to pretrained UNet layer by layer after a zero convolution block  [ 51 ] . After denoising, the generated image and masked image are blended with a blurred mask.'
