    catalog_title: "[ICML 2025] UDora: A Unified Red Teaming Framework against LLM Agents"
    catalog_url: https://github.com/AI-secure/UDora
    kind: open_source
    paper:
      title: 'UDora: A Unified Red Teaming Framework against LLM Agents by Dynamically Hijacking Their Own Reasoning'
      url: https://arxiv.org/abs/2503.01908
      openalex_url: https://openalex.org/W4417094991
      year: 2025
      venue: arXiv (Cornell University)
      authors:
      - Jiawei Zhang
      - Shuang Yang
      - Bo Li
      external_ids:
        ArXiv: '2503.01908'
        DOI: 10.48550/arxiv.2503.01908
        OpenAlex: https://openalex.org/W4417094991
    abstract: Large Language Model (LLM) agents equipped with external tools have become increasingly powerful for complex tasks such as web shopping, automated email replies, and financial trading. However, these advancements amplify the risks of adversarial attacks, especially when agents can access sensitive external functionalities. Nevertheless, manipulating LLM agents into performing targeted malicious actions or invoking specific tools remains challenging, as these agents extensively reason or plan before executing final actions. In this work, we present UDora, a unified red teaming framework designed for LLM agents that dynamically hijacks the agent's reasoning processes to compel malicious behavior. Specifically, UDora first generates the model's reasoning trace for the given task, then automatically identifies optimal points within this trace to insert targeted perturbations. The resulting perturbed reasoning is then used as a surrogate response for optimization. By iteratively applying this process, the LLM agent will then be induced to undertake designated malicious actions or to invoke specific malicious tools. Our approach demonstrates superior effectiveness compared to existing methods across three LLM agent datasets. The code is available at https://github.com/AI-secure/UDora.
    summary: 研究者开发了 UDora框架，旨在利用大型语言模型（LLM）进行红队攻击。该框架通过分析任务的推理过程，并在关键点处插入恶意扰动，导致LLM模型执行恶意行为或触发特定工具。实验结果表明UDora比现有方法更有效。
    citation:
      source: Google Scholar
      source_url: https://scholar.google.com/scholar?hl=en&q=%22UDora%3A+A+Unified+Red+Teaming+Framework+against+LLM+Agents+by+Dynamically+Hijacking+Their+Own+Reasoning%22
      verification_status: search_link_only
    metadata_provenance:
      identity_and_abstract: OpenAlex
      openalex_url: https://openalex.org/W4417094991
    code_impact:
      github_stars: 38
      checked_at: '2026-07-28'
    resolution_status: resolved
    figure:
      image_url: https://ar5iv.labs.arxiv.org/html/2503.01908/assets/x2.png
      caption: 'Figure 2: Our UDora framework for attacking LLM agents. We explore two red-teaming scenarios: malicious environments , where the adversarial string is inserted into the observation, and malicious instructions , where the string is directly inserted into the adversary’s instruction. The optimization process involves: Step 1 , gathering the initial response from the LLM agent; Step 2 , identifying the optimal position in the response for noise insertion (e.g., target item name or function name); Step 3 , optimizing the string to maximize the likelihood of the noise within the modified response. These steps are repeated until the adversarial string successfully misleads the agent into performin'
      source_page: https://arxiv.org/abs/2503.01908
      source_kind: 原论文流程 / 方法图（通过 ar5iv 渲染）
