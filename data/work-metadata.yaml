  ustc-mei-lab:2:
    team_id: ustc-mei-lab
    work_index: 2
    catalog_title: 'AR-Diffusion: Asynchronous Video Generation with Auto-Regressive Diffusion'
    catalog_url: https://ustc-milab.work/
    kind: paper
    paper:
      title: 'AR-Diffusion: Asynchronous Video Generation with Auto-Regressive Diffusion'
      url: https://doi.org/10.1109/cvpr52734.2025.00690
      openalex_url: https://openalex.org/W4413156392
      year: 2025
      venue: 2025 IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR)
      authors:
      - Mingzhen Sun
      - W. H. Wang
      - Gen Li
      - Jiawei Liu
      - Jiahui Sun
      - Wanquan Feng
      - Shanshan Lao
      - Siyu Zhou
      - He Qian
      - Jing Liu
      external_ids:
        DOI: 10.1109/cvpr52734.2025.00690
        OpenAlex: https://openalex.org/W4413156392
    abstract: 'The task of video generation requires synthesizing visually realistic and temporally coherent video frames. Existing methods primarily use asynchronous auto-regressive models or synchronous diffusion models to address this challenge. However, asynchronous auto-regressive models often suffer from inconsistencies between training and inference, leading to issues such as error accumulation, while synchronous diffusion models are limited by their reliance on rigid sequence length. To address these issues, we introduce Auto-Regressive Diffusion (AR-Diffusion), a novel model that combines the strengths of auto-regressive and diffusion models for flexible, asynchronous video generation. Specifically, our approach leverages diffusion to gradually corrupt video frames in both training and inference, reducing the discrepancy between these phases. Inspired by auto-regressive generation, we incorporate a non-decreasing constraint on the corruption timesteps of individual frames, ensuring that earlier frames remain clearer than subsequent ones. This setup, together with temporal causal attention, enables flexible generation of videos with varying lengths while preserving temporal coherence. In addition, we design two specialized timestep schedulers: the FoPP scheduler for balanced timestep sampling during training, and the AD scheduler for flexible timestep differences during inference, supporting both synchronous and asynchronous generation. Extensive experiments demonstrate the superiority of our proposed method, which achieves competitive and state-of-the-art results across four challenging benchmarks. <sup xmlns:mml="http://www.w3.org/1998/Math/MathML" xmlns:xlink="http://www.w3.org/1999/xlink">1 2</sup>'
    summary: 该研究探讨了视频生成任务，旨在合并异步自动回归模型和 diffusión 模型的优势。他们提出了 Auto-Regressive 扩散（AR-扩散）模型，该模型通过逐渐污染视频帧来解决异步生成中的不一致性问题。该模型结合了非递减约束和时间序列注意力，实现了可变长度视频的生成，同时保留时间连贯性。实验结果表明该方法在四个挑战性基准上取得了竞争性和领先性的成果。
