      openalex_url: https://openalex.org/W7135047180
    code_impact:
      github_stars: 459
      checked_at: '2026-07-28'
    resolution_status: resolved
    figure:
      image_url: https://ar5iv.labs.arxiv.org/html/2603.11047/assets/x2.png
      caption: 'Figure 2: Overview of the 3D latent representation. Given samples of the surface light field of the scene, we learn a latent representation that reconstruct the full surface light field information. The encoder (pink block) condenses input information into the latent representation. We jointly supervise the latent representation to contain full 3D geometry and view-dependent radiance information beyond the input samples. In the architectures, we design localized attention pattern to improve efficiency and support 1 million input tokens.'
