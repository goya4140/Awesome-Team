    catalog_title: 'Handling Missing Values in Information Systems Research: A Review of Methods and Assumptions'
    catalog_url: https://nusail.comp.nus.edu.sg/integrating-deep-learning-statistical-models-and-structured-representations/index.html
    kind: paper_or_project
    paper:
      title: 'Handling Missing Values in Information Systems Research: A Review of Methods and Assumptions'
      url: https://doi.org/10.1287/isre.2022.1104
      openalex_url: https://openalex.org/W4225850876
      year: 2022
      venue: Information Systems Research
      authors:
      - Jiaxu Peng
      - Jungpil Hahn
      - Ke‐Wei Huang
      external_ids:
        DOI: 10.1287/isre.2022.1104
        OpenAlex: https://openalex.org/W4225850876
    abstract: Data have never been more essential to the success of decision making. However, data are often messy. A perennial data challenge is missing values, which frequently occur in real-world data, such as unreported data items in public firms’ financial statements and skipped product ratings from consumers. What is the influence of missing values and how should they be handled? Although we are in a big data era, missing values are not ignorable if data are missing for nonrandom reasons. In the case of product ratings, if only people who favor the product provide ratings while others put aside the product and do not respond, then even a simple mean estimation of the product rating would be significantly biased. Such bias challenges the validity of data analysis, and it cannot be eliminated simply by increasing the sample size of the data. To correct the bias arising from nonrandom missing values, it is necessary to examine and model what causes the missing values. We propose and demonstrate the superior performance of a Monte Carlo likelihood approach to correct the bias. Overall, we recommend well-designed data collection processes with documentation of the possible reasons for missing values, cautious adoption of missing value handling methods, and structured missing value reporting practices.
    summary: 研究探讨了缺失值对决策的影响，发现缺失值如果是由于非随机原因引起的，单纯增加样本大小不足以纠正偏差。该研究提出了 Monte CarloLikelihood方法来纠正偏差，并表明这种方法具有更好的性能。结果建议采取有效数据收集流程、记录可能原因、谨慎采用缺失值处理方法和结构化缺失值报告实践。
