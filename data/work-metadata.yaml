    work_index: 2
    catalog_title: Public release for "Shared Autonomy for Proximal Teaching"
    catalog_url: https://github.com/Stanford-ILIAD/proximal-teaching
    kind: open_source
    paper:
      title: Shared Autonomy for Proximal Teaching
      url: https://doi.org/10.1109/hri61500.2025.10973807
      openalex_url: https://openalex.org/W4410296736
      year: 2025
      venue: 2025 20th ACM/IEEE International Conference on Human-Robot Interaction (HRI)
      authors:
      - Megha Srivastava
      - Reihaneh Iranmanesh
      - Yuchen Cui
      - Deepak Gopinath
      - Emily Sumner
      - Andrew Silva
      - Laporsha Dees
      - Guy Rosman
      - Dorsa Sadigh
      external_ids:
        DOI: 10.1109/hri61500.2025.10973807
        OpenAlex: https://openalex.org/W4410296736
    abstract: Motor skills education often requires experienced professionals who can provide personalized instruction. Unfortu-nately, the availability of high-quality training can be limited for specialized tasks, such as high performance racing. Several recent works have proposed AI -assistance for motor skills instruction, ranging from rehabilitation to surgical robot tele-operation. However, these works often make simplifying assumptions on the student learning process, and fail to model how a teacher's assistance interacts with different individuals' abilities when determining optimal teaching strategies. Inspired by the idea of scaffolding from educational psychology, we leverage shared autonomy, a framework for combining user inputs with robot autonomy, to aid with curriculum design. Our key insight is that the way a student's behavior improves in the presence of assistance from an autonomous agent can highlight which sub-skills might be most “learnable” for the student, or within their Zone of Proximal Development. We use this to design Z-COACH, a method for using shared autonomy to provide personalized instruction targeting interpretable task sub-skills. In a user study <tex xmlns:mml="http://www.w3.org/1998/Math/MathML" xmlns:xlink="http://www.w3.org/1999/xlink">$(\mathrm{n}=50)$</tex>, where we teach high performance racing in a simulated environment of the Thunderhill Raceway Park with the CARLA Autonomous Driving simulator, we show that Z-COACH helps identify which skills each student should first practice, leading to an overall improvement in driving time, behavior, and smoothness. Our work shows that increasingly available semi-autonomous capabilities (e.g. in vehicles, robots) can not only assist human users, but also help teach them.
    summary: 研究者开发了Z-COACH方法，利用共享自主性框架来提供个人化的运动技能教育。该方法通过分析学生在自动化辅助下行为改善的方式，确定哪些子技能是最适合的学习目标。这项研究在一项用户实验中证明了Z-COACH的有效性，可以提高驾驶时间、行为和平滑度。
