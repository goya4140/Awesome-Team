  ustc-mei-lab:0:
    team_id: ustc-mei-lab
    work_index: 0
    catalog_title: Bayesian Window Transformer for Image Restoration
    catalog_url: https://ustc-milab.work/
    kind: paper
    paper:
      title: Bayesian Window Transformer for Image Restoration
      url: https://doi.org/10.1109/tpami.2025.3626947
      openalex_url: https://openalex.org/W4415743471
      year: 2025
      venue: IEEE Transactions on Pattern Analysis and Machine Intelligence
      authors:
      - Jie Xiao
      - Xueyang Fu
      - Yurui Zhu
      - Zheng-Jun Zha
      external_ids:
        DOI: 10.1109/tpami.2025.3626947
        OpenAlex: https://openalex.org/W4415743471
    abstract: 'Transformers have excelled in image restoration due to their advanced representational abilities. However, their reliance on a fixed local window for attention often undermines translation invariance and local relationship preservation. This limitation can reduce network stability, especially when dealing with positional changes in degradation scenarios. In this research, we present a new Bayesian Window Transformer, which innovates by employing a probability distribution for window shifts, overcoming the limitations of fixed window configurations in traditional transformers. This approach allows for more flexible coverage beyond a predetermined region. During the evaluation procedure, we further develop two approximate inference algorithms: Layer Expectation Propagation and Monte Carlo Average. These two algorithms calculate expectations derived from the introduced distribution to effectively approximate the marginalization results of the probabilistic variables. Hence, our Bayesian Window Transformer not only inherits the powerful representation ability but also maintains essential properties like translation invariance and local relationship preservation for image restoration. We also provide a theoretical guarantee, demonstrating that our method is aligned with the classic sliding window technique in terms of receptive field sizes and sliding behavior. Comprehensive experiments validate the exceptional effectiveness of our Bayesian Window Transformer across multiple image restoration tasks, including image deraining, denoising, and deblurring.'
    summary: 研究者提出了一个新的Bayesian Window Transformer，通过引入概率分布来实现窗口的动态调整，从而克服传统Transformer的局限性。该方法不仅保留了Transformer强大的表达能力，还维护了翻译变异性和局部关系的重要性。实验结果显示，该方法在多种图像恢复任务中表现出突出的效果。
    citation:
      source: Google Scholar
      source_url: https://scholar.google.com/scholar?hl=en&q=%22Bayesian+Window+Transformer+for+Image+Restoration%22
      verification_status: search_link_only
