      caption: 'Figure 1: Granular results of our exam evaluation for the task of AWS DevOps troubleshooting. Accuracy is reported for different retrieval approaches and retriever sizes, on a % scale. Labels on the diameter shows the troubleshooting categories, i.e., AWS resources. Colors correspond to different retrieval approaches ( Oracle , DPRV2 , MultiQA , ClosedBook , as discussed in Section  4.2 ) and patterns correspond to the base LLM size (7B, 13B, and 70B). For instance, we observe that a small model such as Mistral-7B with MultiQA embeddings has an accuracy around 80% for the AWS resource “Relational Database Service” (RDS).'
