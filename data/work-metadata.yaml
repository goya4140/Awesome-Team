      caption: 'Figure 1 : The richness of an image’s content often necessitates long captions for adequate description, with each sentence likely conveying a fragment of the image’s entirety. Thanks to the long captions, our DreamLIP trained with 30M image-text pairs achieves on par or even better performance than CLIP trained with 400M pairs on the tasks of image-text retrieval, semantic segmentation, and image understanding in MLLM.'
