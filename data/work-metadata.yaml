    summary: 该研究探讨了如何使用未注释的现实生活视频来预训练视觉-语言-动作（VLA）模型。研究人员开发了一种全自动的人类手活动分析方法，可以将人类手作为可Manipulation机器人末端，转换为与现有机器人V-L-A培训数据相符的数据格式。这一方法生成了具有语言描述和3D手部运动和摄像头运动的每个手部活动段。该研究创建了一大规模的手部VLA培训数据集，包含1M个场景和26M帧。预训练模型在未见过的现实世界观察上表现出强大的零-shot能力，并且通过 fine-tuning 在小样本的真实机器人动作数据中，提高了任务成功率和对新物体的 generalizeability。
