    catalog_title: MLE-bench is a benchmark for measuring how well AI agents perform at machine learning engineering
    catalog_url: https://github.com/openai/mle-bench
    kind: open_source
    paper:
      title: 'MLE-bench: Evaluating Machine Learning Agents on Machine Learning Engineering'
      url: https://arxiv.org/abs/2410.07095
      openalex_url: https://openalex.org/W4403345800
      year: 2024
      venue: arXiv (Cornell University)
      authors:
      - Chan, Jun Shern
      - Neil Chowdhury
      - Oliver Jaffe
      - James Aung
      - Dane Sherburn
      - Evan Mays
      - Giulio Starace
      - Kevin Liu
      - Leon Maksin
      - Tejal Patwardhan
      external_ids:
        ArXiv: '2410.07095'
        DOI: 10.48550/arxiv.2410.07095
        OpenAlex: https://openalex.org/W4403345800
    abstract: 'This paper develops a theory of search stability for long-running agents operating under finite active context, delayed verification, sparse expensive feedback, path-dependent lock-in, and lossy state compression. The focus is not only on model quality, but on the mesoscopic law layer that governs how an agent should preserve, retire, substitute, compress, branch, and reset competing hypotheses or route summaries over time. The framework models search state as an active hypothesis portfolio partitioned into coarse families under a context budget. Each item carries promise, verification lag, retention cost, staleness, overlap burden, and inertia. A central contribution is a set-valued adequacy semantics: within each discrimination window, the system is associated with a nonempty random set of operationally adequate families induced by the realized initial information state and downstream randomness. Success is defined as preserving recoverability of at least one adequate family at the first strongly discriminating verification stage, avoiding dependence on a selector-defined pseudo-truth. The paper derives threshold and impossibility results for context contamination, shadow retirement, delayed-verification coverage, reserve feasibility, and budget-limited adequacy. It also develops a theory of within-family semantic substitution, compressed-control alias hazard, reset admissibility, stale-legacy drift, diagnostic regret decomposition, and rolling-window lifting for long-running agents with repeated verification stages and changing task modes. The intended contribution is an audit-and-design law layer for bounded-memory AI systems. The theory is deliberately narrow and conditional, but it aims to make long-horizon agent failures more diagnosable: separating failures caused by bounded-memory hypothesis ecology from failures caused by raw model weakness, and from mixtures of both.'
    summary: 该研究探讨了长时间运行的智能代理在有限活动环境下如何保持稳定性。研究重点不仅是模型质量，还是在中间层次上研究如何让代理维持、退役、替换、压缩、分支和重置竞争性的假设或路线总结。该框架将搜索状态表示为一个被分成粗糙家族的活跃假设组合，各个项目都包含了承诺、验证延迟、保留成本、老化、重叠负担和 inertia。研究的关键贡献是建立了一种适当性语义：在每个鉴别窗口中，系统与一个非空随机集合相关联，这个集合由现实初始信息状态和下游随机性的实现所诞生。成功定义为在第一阶段强烈鉴别的验证阶段中至少保留一个适当家族的recoverability，避免依赖于选择器定义的伪真。研究
