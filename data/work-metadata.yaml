      caption: 'Figure 2 : Overview of ResTok. (a) Pipeline of encoding and decoding processes. There are S − 1 S-1 residual merging blocks uniformly replacing the original transformer blocks in the encoder, where S S denotes the number of scales. (b) Residual 1D latent token initialization. When increasing the target size of pooling, we first double the width, and then alternately double the height and width in subsequent steps. (c) Residual merging block. Average pooling is used as the merging method in our experiments.'
