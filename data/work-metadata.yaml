    abstract: Learning-based controllers show promising performances in robotic control tasks. However, they still present potential safety risks due to the difficulty in ensuring satisfaction of complex action constraints. We propose a novel action-constrained reinforcement learning method, which transforms the constrained action space into its dual space and uses Dirichlet distribution policy to guarantee strict constraint satisfaction as well as randomized exploration. We validate the proposed method in benchmark environments and in a real quadruped locomotion task. Our method outperforms other baselines with higher reward and faster inference speed. Results of the real robot experiments demonstrate the effectiveness and potential application of our method.
    summary: 该研究提出了一种新的动作约束强化学习方法，通过将动作空间转换为其对应的双空间，并使用Dirichlet分布策略来保证严格约束满足，同时进行随机探索。实验结果表明该方法在benchmark环境和实际四肢行走任务中表现出更高的奖励和更快的推导速度，证明了该方法的有效性和潜在应用价值。
