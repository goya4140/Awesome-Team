      title: 'Programming Every Example: Lifting Pre-training Data Quality Like Experts at Scale'
      url: https://arxiv.org/abs/2409.17115
      openalex_url: https://openalex.org/W4403785094
      year: 2024
      venue: arXiv (Cornell University)
      authors:
      - Fan Zhou
      - Zengzhi Wang
      - Qian Liu
      - Junlong Li
      - Pengfei Liu
      external_ids:
        ArXiv: '2409.17115'
        DOI: 10.48550/arxiv.2409.17115
        OpenAlex: https://openalex.org/W4403785094
    abstract: 'Large language model pre-training has traditionally relied on human experts to craft heuristics for improving the corpora quality, resulting in numerous rules developed to date. However, these rules lack the flexibility to address the unique characteristics of individual example effectively. Meanwhile, applying tailored rules to every example is impractical for human experts. In this paper, we demonstrate that even small language models, with as few as 0.3B parameters, can exhibit substantial data refining capabilities comparable to those of human experts. We introduce Programming Every Example (ProX), a novel framework that treats data refinement as a programming task, enabling models to refine corpora by generating and executing fine-grained operations, such as string normalization, for each individual example at scale. Experimental results show that models pre-trained on ProX-curated data outperform either original data or data filtered by other selection methods by more than 2% across various downstream benchmarks. Its effectiveness spans various model sizes and pre-training corpora, including C4, RedPajama-V2, FineWeb, FineWeb-Edu, and DCLM. Furthermore, ProX exhibits significant potential in domain-specific continual pre-training: without domain specific design, models trained on OpenWebMath refined by ProX outperform human-crafted rule-based methods, improving average accuracy by 7.6% over Mistral-7B, with 14.6% for Llama-2-7B and 20.3% for CodeLlama-7B, all within 10B tokens to be comparable to models like Llemma-7B trained on 200B tokens. Further analysis highlights that ProX significantly saves training FLOPs, offering a promising path for efficient LLM pre-training. We are open-sourcing ProX with &gt;500B corpus, models, and sharing all training and implementation details for reproducible research and future innovation. Code: https://github.com/GAIR-NLP/ProX'
    summary: 研究表明，即使使用小型语言模型（0.3B参数），它们也可以通过“编程每个例子”（ProX）框架有效地改善数据质量，超过人类专家和其他选择方法。实验结果显示，预训练于ProX优化的数据下，模型的性能大幅提高。
