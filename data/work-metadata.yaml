    catalog_title: "[ICLR 2026] Taming large-scale few-step training with self-adversarial flows! \U0001F44F\U0001F3FB"
    catalog_url: https://github.com/inclusionAI/TwinFlow
    kind: open_source
    paper:
      title: 'TwinFlow: Realizing One-step Generation on Large Models with Self-adversarial Flows'
      url: https://arxiv.org/abs/2512.05150
      openalex_url: https://openalex.org/W4417141653
      year: 2025
      venue: arXiv (Cornell University)
      authors:
      - Zhenglin Cheng
      - Peng Sun
      - Jianguo Li
      - Tao Lin
      external_ids:
        ArXiv: '2512.05150'
        DOI: 10.48550/arxiv.2512.05150
        OpenAlex: https://openalex.org/W4417141653
    abstract: Recent advances in large multi-modal generative models have demonstrated impressive capabilities in multi-modal generation, including image and video generation. These models are typically built upon multi-step frameworks like diffusion and flow matching, which inherently limits their inference efficiency (requiring 40-100 Number of Function Evaluations (NFEs)). While various few-step methods aim to accelerate the inference, existing solutions have clear limitations. Prominent distillation-based methods, such as progressive and consistency distillation, either require an iterative distillation procedure or show significant degradation at very few steps (&lt; 4-NFE). Meanwhile, integrating adversarial training into distillation (e.g., DMD/DMD2 and SANA-Sprint) to enhance performance introduces training instability, added complexity, and high GPU memory overhead due to the auxiliary trained models. To this end, we propose TwinFlow, a simple yet effective framework for training 1-step generative models that bypasses the need of fixed pretrained teacher models and avoids standard adversarial networks during training, making it ideal for building large-scale, efficient models. On text-to-image tasks, our method achieves a GenEval score of 0.83 in 1-NFE, outperforming strong baselines like SANA-Sprint (a GAN loss-based framework) and RCGM (a consistency-based framework). Notably, we demonstrate the scalability of TwinFlow by full-parameter training on Qwen-Image-20B and transform it into an efficient few-step generator. With just 1-NFE, our approach matches the performance of the original 100-NFE model on both the GenEval and DPG-Bench benchmarks, reducing computational cost by $100\times$ with minor quality degradation. Project page is available at https://zhenglin-cheng.com/twinflow.
    summary: 研究者提出了TwinFlow框架，旨在提高大型多模态生成模型的效率。该方法通过简化传统的distillation和adversarial training过程，实现1步生成模型的训练，从而降低计算成本并保持性能。
