      caption: 'Figure 1: Instead of finetuning LLMs with DP-SGD to generate synthetic text, our Aug-PE only requires inference APIs of LLMs. Aug-PE works with the latest open-source LLMs and API-based LLMs to generate DP synthetic text with improved utility on OpenReview dataset, where DP-SGD finetuning is either hard to implement or infeasible.'
