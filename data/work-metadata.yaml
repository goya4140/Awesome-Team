    kind: open_source
    paper:
      title: 'R-Horizon: How Far Can Your Large Reasoning Model Really Go in Breadth and Depth?'
      url: https://arxiv.org/abs/2510.08189
      openalex_url: https://openalex.org/W4416383416
      year: 2025
      venue: arXiv (Cornell University)
      authors:
      - Yimin Lu
      - Jianing Wang
      - Linsen Guo
      - Wei He
      - Hongyin Tang
      - Tao Gui
      - Huang, Xuanjing
      - Xuezhi Cao
