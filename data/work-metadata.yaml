      caption: 'Figure 2 : Overview of the FastVLM architecture. FastVLM consists of our novel vision encoder, FastViTHD, trained using the same setup as LLaVa. The FastViTHD architecture is designed and trained for low latency at high resolution, utilizing novel multi-scale pooling, additional self-attention layers, and downsampling to generate 4 × \times fewer tokens than FastViT, and 16 × \times fewer tokens than ViT-L/14 at resolution 336.'
