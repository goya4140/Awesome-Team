  stanford-iliad:0:
    team_id: stanford-iliad
    work_index: 0
    catalog_title: 'Companion code for RSS 2020 paper: "Active Preference-Based Gaussian Process Regression for Reward Learning"'
    catalog_url: https://github.com/Stanford-ILIAD/active-preference-based-gpr
    kind: open_source
    paper:
      title: Active Preference-Based Gaussian Process Regression for Reward Learning
      url: https://doi.org/10.15607/rss.2020.xvi.041
      openalex_url: https://openalex.org/W3039563104
      year: 2020
      venue: 'Robotics: Science and Systems XVI'
      authors:
      - Erdem Bıyık
      - Nicolas Huynh
      - Mykel J. Kochenderfer
      - Dorsa Sadigh
      external_ids:
        DOI: 10.15607/rss.2020.xvi.041
        OpenAlex: https://openalex.org/W3039563104
    abstract: 'Designing reward functions is a challenging problem in AI and robotics. Humans usually have a difficult time directly specifying all the desirable behaviors that a robot needs to optimize. One common approach is to learn reward functions from collected expert demonstrations. However, learning reward functions from demonstrations introduces many challenges: some methods require highly structured models, e.g. reward functions that are linear in some predefined set of features, while others adopt less structured reward functions that on the other hand require tremendous amount of data. In addition, humans tend to have a difficult time providing demonstrations on robots with high degrees of freedom, or even quantifying reward values for given demonstrations. To address these challenges, we present a preference-based learning approach, where as an alternative, the human feedback is only in the form of comparisons between trajectories. Furthermore, we do not assume highly constrained structures on the reward function. Instead, we model the reward function using a Gaussian Process (GP) and propose a mathematical formulation to actively find a GP using only human preferences. Our approach enables us to tackle both inflexibility and data-inefficiency problems within a preferencebased learning framework. Our results in simulations and a user study suggest that our approach can efficiently learn expressive reward functions for robotics tasks.'
    summary: 研究问题是如何让人机交互设计出合适的奖励函数。该方法使用Gaussian Process模型，通过人类对动作序列的比较来学习奖励函数，不需要预先定义特定的结构或大量数据。实验结果表明这种方法可以有效地学习 robotics 任务的 expressive reward functions。
