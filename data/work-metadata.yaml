    summary: 该工作《Structured 3D Latents for Scalable and Versatile 3D Generation》聚焦于其标题所述的研究问题。原始摘要要点：We introduce a novel 3D generation method for versatile and high-quality 3D asset creation.  The cornerstone is a unified Structured LATent (SLAT) representation which allows decoding to different output formats, such as Radiance Fields, 3D Gaussians, and meshes.
