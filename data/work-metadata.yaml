    figure:
      image_url: https://ar5iv.labs.arxiv.org/html/2305.19270/assets/x8.png
      caption: 'Figure 4: The training protocol of five incremental stages in Flickr30K. We split training instances into five tasks, i.e. , walk, stand, run, ride, and play. The training/testing sets do not include images that do not fall into these tasks. We use the pre-trained BEiT-3 as the initialization and sequentially learn cross-modal retrieval tasks. At the end of each task, the model is evaluated on all previously learned concepts.'
