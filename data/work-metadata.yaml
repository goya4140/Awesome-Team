    catalog_title: '[ACL 2026] "OpenPhone: Mobile Agentic Foundation Models for AI Phone"'
    catalog_url: https://github.com/HKUDS/OpenPhone
    kind: open_source
    paper:
      title: 'OpenPhone: Mobile Agentic Foundation Models'
      url: https://doi.org/10.18653/v1/2026.findings-acl.1518
      openalex_url: https://openalex.org/W7166866896
      year: 2026
      venue: 'Findings of the Association for Computational Linguistics: ACL 2026'
      authors:
      - Yangqin Jiang
      - Chao Huang
      external_ids:
        DOI: 10.18653/v1/2026.findings-acl.1518
        OpenAlex: https://openalex.org/W7166866896
    abstract: 'With the advancement of multimodal large language models (MLLMs), building GUI agent systems has become an increasingly promising direction-especially for mobile platforms, given their rich app ecosystems and intuitive touch interactions.Yet mobile GUI agents face a critical dilemma: truly on-device models (4B or smaller) lack sufficient performance, while capable models (starting from 7B) are either too large for mobile deployment or prohibitively costly (e.g., cloud-only closed-source MLLMs).To resolve this, we propose OpenPhone, a mobile GUI agent system that leverages devicecloud collaboration to tap the cost-efficiency of on-device models and the high capability of cloud models, while avoiding their drawbacks.Specifically, OpenPhone enhances Qwen2.5-VL-3Bvia two-stage SFT→GRPO training on synthetic GUI data for strong decision-making, integrates an efficient long-reasoning and memory management mechanism to utilize historical interactions under tight resources, and defaults to on-device execution-only escalating challenging subtasks to the cloud via realtime complexity assessment.Experiments on the online AndroidLab benchmark and diverse apps show OpenPhone matches or nears larger models, with a significant reduction in cloud costs.We have made our OpenPhone available anonymously at:'
    summary: 研究者提出了OpenPhone，一个可以在移动设备上运行的GUI agent系统。该系统利用了设备和云之间的合作，能够获得成本效益的局部模型和高能力的云模型的优势。通过两阶段的训练和实时复杂性评估，OpenPhone能够有效地解决移动设备上的性能问题，并在云上执行困难任务。
    citation:
      source: Google Scholar
      source_url: https://scholar.google.com/scholar?hl=en&q=%22OpenPhone%3A+Mobile+Agentic+Foundation+Models%22
