      - Ming Lu
      - Zhan Ma
      external_ids:
        ArXiv: '2601.03955'
        DOI: 10.48550/arxiv.2601.03955
        OpenAlex: https://openalex.org/W7119511922
    summary: '该工作《ResTok: Learning Hierarchical Residuals in 1D Visual Tokenizers for Autoregressive Image Generation》聚焦于其标题所述的研究问题。原始摘要要点：Existing 1D visual tokenizers for autoregressive (AR) generation largely follow the design principles of language modeling, as they are built directly upon transformers whose priors originate in language, yielding single-hierarchy latent tokens and treating visual data as flat sequential token streams.  However, this language-like formulation overlooks key properties of vision, particularly the hierarchical and residual network designs that have long been essential for convergence and efficiency in visual models.'
    citation:
