      title: 'LongWriter: Unleashing 10,000+ Word Generation from Long Context LLMs'
      url: https://arxiv.org/abs/2408.07055
      openalex_url: https://openalex.org/W4402427428
      year: 2024
      venue: arXiv (Cornell University)
      authors:
      - Yushi Bai
      - Jiajie Zhang
      - Xin Lv
      - Linzhi Zheng
      - Siqi Zhu
      - Lei Hou
      - Yuxiao Dong
      - Jie Tang
      - Juanzi Li
      external_ids:
        ArXiv: '2408.07055'
        DOI: 10.48550/arxiv.2408.07055
        OpenAlex: https://openalex.org/W4402427428
    abstract: 'Current long context large language models (LLMs) can process inputs up to 100,000 tokens, yet struggle to generate outputs exceeding even a modest length of 2,000 words. Through controlled experiments, we find that the model''s effective generation length is inherently bounded by the sample it has seen during supervised fine-tuning (SFT). In other words, their output limitation is due to the scarcity of long-output examples in existing SFT datasets. To address this, we introduce AgentWrite, an agent-based pipeline that decomposes ultra-long generation tasks into subtasks, enabling off-the-shelf LLMs to generate coherent outputs exceeding 20,000 words. Leveraging AgentWrite, we construct LongWriter-6k, a dataset containing 6,000 SFT data with output lengths ranging from 2k to 32k words. By incorporating this dataset into model training, we successfully scale the output length of existing models to over 10,000 words while maintaining output quality. We also develop LongBench-Write, a comprehensive benchmark for evaluating ultra-long generation capabilities. Our 9B parameter model, further improved through DPO, achieves state-of-the-art performance on this benchmark, surpassing even much larger proprietary models. In general, our work demonstrates that existing long context LLM already possesses the potential for a larger output window--all you need is data with extended output during model alignment to unlock this capability. Our code &amp; models are at: https://github.com/THUDM/LongWriter.'
    summary: 现有长文本大语言模型（LLM）在处理长输出时遇到瓶颈，主要原因是训练数据中长输出的例子相对稀缺。该研究引入了AgentWrite管道，分解超长生成任务为小任务，从而使现有LLM能够生成超过20,000字的合理输出。通过构建LongWriter-6k数据集和LongBench-Write评估指标，研究者 successfully Scaling LLM 的输出长度至10,000字以上，同时保持输出质量。
