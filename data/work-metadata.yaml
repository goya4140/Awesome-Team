    paper:
      title: Autonomous Evaluation and Refinement of Digital Agents
      url: https://arxiv.org/abs/2404.06474
      openalex_url: https://openalex.org/W4394776438
      year: 2024
      venue: arXiv (Cornell University)
      authors:
      - Jiayi Pan
