    catalog_title: This repository is the official implementation for the ICLR 2025 paper titled "Generalizable Motion Planning Via Operator Learning".
    catalog_url: https://github.com/ExistentialRobotics/PNO
    kind: open_source
    paper:
      title: Generalizable Motion Planning via Operator Learning
      url: https://arxiv.org/abs/2410.17547
      openalex_url: https://openalex.org/W4404305132
      year: 2024
      venue: arXiv (Cornell University)
      authors:
      - Sharath Matada
      - Luke Bhan
      - Yuanyuan Shi
      - Nikolay Atanasov
      external_ids:
        ArXiv: '2410.17547'
        DOI: 10.48550/arxiv.2410.17547
        OpenAlex: https://openalex.org/W4404305132
    abstract: In this work, we introduce a planning neural operator (PNO) for predicting the value function of a motion planning problem. We recast value function approximation as learning a single operator from the cost function space to the value function space, which is defined by an Eikonal partial differential equation (PDE). Therefore, our PNO model, despite being trained with a finite number of samples at coarse resolution, inherits the zero-shot super-resolution property of neural operators. We demonstrate accurate value function approximation at $16\times$ the training resolution on the MovingAI lab's 2D city dataset, compare with state-of-the-art neural value function predictors on 3D scenes from the iGibson building dataset and showcase optimal planning with 4-DOF robotic manipulators. Lastly, we investigate employing the value function output of PNO as a heuristic function to accelerate motion planning. We show theoretically that the PNO heuristic is $ε$-consistent by introducing an inductive bias layer that guarantees our value functions satisfy the triangle inequality. With our heuristic, we achieve a $30\%$ decrease in nodes visited while obtaining near optimal path lengths on the MovingAI lab 2D city dataset, compared to classical planning methods ($A^\ast$, $RRT^\ast$).
    summary: 该研究引入了一种规划神经操作器（Planning Neural Operator，PNO），用于预测运动规划问题的值函数。该模型将值函数估计重写为从成本函数空间到值函数空间的单个操作，从Eikonal部分微分方程（PDE）定义。因此，PNO模型尽管在有限样本下训练，但具有神经操作器的零-shot超解析性。研究表明，该模型在MovingAI lab 2D城市数据集上准确估计值函数，且在3D场景中与现有神经值函数预测器进行比较。在4DOF机器人手臂上展示了优质的规划。
    citation:
