  jd-ai-infrastructures:0:
    team_id: jd-ai-infrastructures
    work_index: 0
    catalog_title: "[ACL 2026] OxyGent: Making Multi-Agent Systems Modular, Observable, and Evolvable via Oxy Abstraction https://arxiv.org/abs/2604.25602"
    catalog_url: https://github.com/jd-opensource/OxyGent
    kind: open_source
    paper:
      title: 'OxyGent: Making Multi-Agent Systems Modular, Observable, and Evolvable via Oxy Abstraction'
      url: https://arxiv.org/abs/2604.25602
      openalex_url: https://openalex.org/W7157764945
      year: 2026
      venue: arXiv (Cornell University)
      authors:
      - Junxing Hu
      - Tianlong Li
      - Lei Yu
      - Ai Han
      external_ids:
        ArXiv: '2604.25602'
        DOI: 10.48550/arxiv.2604.25602
        OpenAlex: https://openalex.org/W7157764945
    abstract: 'Deploying production-ready multi-agent systems (MAS) in complex industrial environments remains challenging due to limitations in scalability, observability, and autonomous evolution. We present OxyGent, an open-source framework driven by two core novelties: a unified Oxy abstraction and the OxyBank evolution engine. The unified abstraction encapsulates agents, tools, LLMs, and reasoning flows as pluggable atomic components, enabling Lego-like scalable system composition and non-intrusive monitoring. To enhance observability, OxyGent introduces permission-driven dynamic planning that replaces rigid workflows with execution graphs generated at runtime, providing adaptive visualizations. Furthermore, to support continuous evolution, OxyBank serves as an AI asset management platform that drives automated data backflow, annotation, and joint evolution. Empirical evaluations and real-world case studies show that OxyGent provides a robust and scalable foundation for MAS. OxyGent is fully open-sourced under the Apache License 2.0 at https://github.com/jd-opensource/OxyGent.'
    summary: 研究问题是如何在复杂的工业环境中部署可生产化的多-agent系统（MAS）。该研究提出了OxyGent框架，利用统一的氧气抽象和氧气银行演化引擎。OxyGent提供了可扩展、监控和持续演化的能力，使其成为 MAS的 Robust 和 Scalable 基础。
    citation:
      source: Google Scholar
      source_url: https://scholar.google.com/scholar?hl=en&q=%22OxyGent%3A+Making+Multi-Agent+Systems+Modular%2C+Observable%2C+and+Evolvable+via+Oxy+Abstraction%22
      verification_status: search_link_only
    metadata_provenance:
      identity_and_abstract: OpenAlex
      openalex_url: https://openalex.org/W7157764945
    code_impact:
      github_stars: 2022
      checked_at: '2026-07-28'
    resolution_status: resolved
    figure:
      image_url: https://ar5iv.labs.arxiv.org/html/2604.25602/assets/img/oxy_monitor.png
      caption: 'Figure 5: MAS inference monitoring. OxyGent has built-in production-grade time tracking, which displays task distribution and resource congestion in real time, facilitating MAS architecture optimization. More features are introduced in Appendix  A.1 .'
      source_page: https://arxiv.org/abs/2604.25602
      source_kind: 原论文流程 / 方法图（通过 ar5iv 渲染）
      selection_score: 6
