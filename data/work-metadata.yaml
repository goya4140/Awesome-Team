      caption: 'Figure 1 : Given a single-view image across various domains ( e.g. , real-world, text-to-image, animation), we first extract the monocular depth and focal length of it via Depth-Pro  [ 6 ] and then achieve relative point clouds. Then, the proposed Uni3C can generate impressive videos under arbitrary camera trajectories (a), human motion characters (SMPL-X  [ 36 ] ), or both of these conditions (b). (c) Uni3C further supports the camera-controlled motion transfer.'
