    work_index: 2
    catalog_title: "[CVPR 2025] Official PyTorch Implementation of MambaVision: A Hybrid Mamba-Transformer Vision Backbone"
    catalog_url: https://github.com/NVlabs/MambaVision
    kind: open_source
    paper:
      title: 'MambaVision: A Hybrid Mamba-Transformer Vision Backbone'
      url: https://arxiv.org/abs/2407.08083
      openalex_url: https://openalex.org/W4400611405
      year: 2024
      venue: arXiv (Cornell University)
      authors:
      - Ali Hatamizadeh
      - Jan Kautz
      external_ids:
        ArXiv: '2407.08083'
        DOI: 10.48550/arxiv.2407.08083
        OpenAlex: https://openalex.org/W4400611405
    abstract: 'We propose a novel hybrid Mamba-Transformer backbone, MambaVision, specifically tailored for vision applications. Our core contribution includes redesigning the Mamba formulation to enhance its capability for efficient modeling of visual features. Through a comprehensive ablation study, we demonstrate the feasibility of integrating Vision Transformers (ViT) with Mamba. Our results show that equipping the Mamba architecture with self-attention blocks in the final layers greatly improves its capacity to capture long-range spatial dependencies. Based on these findings, we introduce a family of MambaVision models with a hierarchical architecture to meet various design criteria. For classification on the ImageNet-1K dataset, MambaVision variants achieve state-of-the-art (SOTA) performance in terms of both Top-1 accuracy and throughput. In downstream tasks such as object detection, instance segmentation, and semantic segmentation on MS COCO and ADE20K datasets, MambaVision outperforms comparably sized backbones while demonstrating favorable performance. Code: https://github.com/NVlabs/MambaVision'
    summary: 该研究提出了MambaVision，一个专门设计的Mamba-Transformer骨架，用于视觉应用。通过综合性分析，发现将Mamba与视觉变换器（ViT）结合起来可以显著提高其处理长距离空间依赖性的能力。MambaVision模型在ImageNet-1K数据集上的分类任务表现出SOTA的性能，并在其他下游任务如检测、分割等方面也取得了优异的结果。
    citation:
      source: Google Scholar
      source_url: https://scholar.google.com/scholar?hl=en&q=%22MambaVision%3A+A+Hybrid+Mamba-Transformer+Vision+Backbone%22
      verification_status: search_link_only
    metadata_provenance:
      identity_and_abstract: OpenAlex
      openalex_url: https://openalex.org/W4400611405
    code_impact:
      github_stars: 2210
      checked_at: '2026-07-28'
    resolution_status: resolved
    figure:
      image_url: https://ar5iv.labs.arxiv.org/html/2407.08083/assets/x1.png
      caption: "Figure 2 : The architecture of hierarchical MambaVision models. The first two stages use residual convolutional blocks for fast feature extraction. Stage 3 and 4 employ both MambaVision and Transformer blocks. Specifically, given N \U0001D441 N layers, we use N 2 \U0001D441 2 \\frac{N}{2} MambaVision and MLP blocks which are followed by additional N 2 \U0001D441 2 \\frac{N}{2} Transformer and MLP blocks. The Transformer blocks in final layers allow for recovering lost global context and capture long-range spatial dependencies."
      source_page: https://arxiv.org/abs/2407.08083
