    catalog_title: 'Evaluating Grammatical Well-Formedness in Large Language Models: A Comparative Study with Human Judgments'
    catalog_url: https://aclanthology.org/2024.cmcl-1.16/
    kind: paper
    paper:
      title: 'Evaluating Grammatical Well-Formedness in Large Language Models: A Comparative Study with Human Judgments'
      url: https://doi.org/10.18653/v1/2024.cmcl-1.16
      openalex_url: https://openalex.org/W4402671066
      year: 2024
      venue: Proceedings of the Workshop on Cognitive Modeling and Computational Linguistics
      authors:
      - Zhuang Qiu
      - Xufeng Duan
      - Zhenguang G. Cai
      external_ids:
        DOI: 10.18653/v1/2024.cmcl-1.16
        OpenAlex: https://openalex.org/W4402671066
    abstract: Research in artificial intelligence has witnessed the surge of large language models (LLMs) demonstrating improved performance in various natural language processing tasks.This has sparked significant discussions about the extent to which large language models emulate human linguistic cognition and usage.This study delves into the representation of grammatical well-formedness in LLMs, which is a critical aspect of linguistic knowledge.In three preregistered experiments, we collected grammaticality judgment data for over 2400 English sentences with varying structures from Chat-GPT and Vicuna, comparing them with human judgment data.The results reveal substantial alignment in the assessment of grammatical correctness between LLMs and human judgments, albeit with LLMs often showing more conservative judgments for grammatical correctness or incorrectness.
    summary: 本研究探讨了大型语言模型（LLM）在表示语法正确性的表达方式上与人类的相似性。通过三个预先注册的实验，研究人员收集了Chat-GPT和Vicuna等LLM处理的2400多个英文句子，并与人类判断结果进行比较。结果显示，LLMs与人类判断结果的语法正确性评估有着显著的相似性，但LLMs往往表现出更保守的判断。
