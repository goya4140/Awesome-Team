        OpenAlex: https://openalex.org/W4416034017
    abstract: 'Testing is essential to modern software engineering for building reliable software.Given the high costs of manually creating test cases, automated test case generation, particularly methods utilizing large language models, has become increasingly popular.These neural approaches generate semantically meaningful tests that are more maintainable compared with traditional automated testing methods such as fuzzing.However, the diversity and volume of unit tests in current datasets are limited, especially for newer but important languages.In this paper, we present a novel data augmentation technique, FuzzAug, that brings the benefits of fuzzing to large language models by incorporating valid testing semantics and providing diverse coverage-guided inputs.Doubling the size of training datasets, FuzzAug improves performance over the baselines significantly.This technique demonstrates the potential of introducing prior knowledge from dynamic software analysis to improve neural test generation, offering significant enhancements in this task.Our code is open-sourced at https: //github.com/SecurityLab-UCD/FuzzAug.'
