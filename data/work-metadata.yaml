    summary: 该工作《Detecting Knowledge Boundary of Vision Large Language Models by Sampling-Based Inference》聚焦于其标题所述的研究问题。原始摘要要点：Despite the advancements made in Vision Large Language Models (VLLMs), like text Large Language Models (LLMs), they have limitations in addressing questions that require real-time information or are knowledge-intensive.  Indiscriminately adopting Retrieval Augmented Generation (RAG) techniques is an effective yet expensive way to enable models to answer queries beyond their knowledge scopes.
