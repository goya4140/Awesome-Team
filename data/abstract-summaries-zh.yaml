    summary_zh: 该研究旨在开发一种能够有效表示视频动态的方法，即Trajectory Field。该方法将每个视频分成一个连续的3D轨迹，作为动态的基本单位。通过这种方法，提出了Trace Anything神经网络，该模型可以预测整个轨迹场景在单次前向传递中。该模型对4D数据进行了训练，并且实验结果表明：(i) Trace Anything在新建立的轨迹场景估计benchmark上取得了state-of-the-art表现，竞争性地在已有的点跟踪benchmark上表现出色；(ii) 该模型由于其单次前向传递的原则，没有需要进行迭代优化或辅助估计器，从而获得了显著的效率优势；(iii) 该模型还展现出了新颖的能力，包括目标条件操纵、运动预测和空间-时间融合。
    model: llama3.2
    generated_at: '2026-07-28'
  bytedance-seed:2:
