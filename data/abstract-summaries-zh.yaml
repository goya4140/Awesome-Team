  zju-real:1:
    abstract_sha256: eea602026e8bb82d0cefb04152519e933b3e0a09a7065d641e80c172a6802716
    summary_zh: 研究表明，当前的视觉语言模型（VLM）难以实现稳健的空间推理能力。该研究提出了一种通过逐步建立感知和理解的层次结构来解决这一问题的方法。通过构建了一个包含26,610个样本的多模态数据集，并设计了一个三阶段的进步训练框架，该框架首先建立空间感知，接着发展空间理解，最终强化复杂推理。该方法得到了3B参数模型SpatialLadder的成功应用，实现了对空间推理benchmark的state-of-the-art表现，且在出域测试中保持了强大的 generalize能力。
    model: llama3.2
    generated_at: '2026-07-28'
  zju-real:2:
    abstract_sha256: 4f8e3c39d4e26c390ae912bb7ff59b75ba29cb8b5edcf4274254e50c6a5c5e18
    summary_zh: 研究者发现现有视觉语言模型（VLM）在理解和推理视觉内容方面取得了显著成就，但在跨视角理解和空间推理方面仍存在挑战。他们开发了ViewSpatial-Bench，一个专门针对多视角空间定位识别评估的全面benchmark，并发现通过 fine-tuning VLMs 在多视角空间数据上，性能可以提高 46.24%。
    model: llama3.2
    generated_at: '2026-07-28'
