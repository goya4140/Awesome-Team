  berkeley-nlp:2:
    abstract_sha256: 375ae5e013eb9fc1973b334b366606b2e71e36ff02ec5cb31b28674d600b6057
    summary_zh: 研究人员探讨了如何将长链思考能力从英语转移到其他语言中。他们发现，增加模型大小可以改善非英语语言中的任务性能，但对于需要多步长链思考的任务，效果不佳。通过预训练和后期训练，他们发现专门设计的推理阶段可以提高非英语语言中的性能，但也会降低目标语言中的性能。研究人员还发现不同语言之间存在推理效率差异，并找到了语言特有的失败模式。
    model: llama3.2
    generated_at: '2026-07-28'
  berkeley-rail:0:
    abstract_sha256: 7eca1a6f722f204150c3c3f796906a41c7e2bdac227480e25133ab83a92e28a9
    summary_zh: 该研究探讨了如何让智能机器人通过自主收集经验来改进，避免需要昂贵的人工操作示例数据。研究者提出了一个新方法，可以让机器人在无人监督下从自主收集的数据中改进。该方法使用视觉-语言模型收集和评估有意义的机器人数据，然后分解指令遵循任务为语义条件下的图像生成和非语义目标-reaching，这使得可以在没有人工标注的情况下从自主收集的数据中改进。实验结果表明，在未见过的环境中，机器人政策可以通过自主收集的数据改进2倍。
    model: llama3.2
    generated_at: '2026-07-28'
