    summary_zh: 本文 introduces PolyMath，一个涵盖18种语言和4个难度级别的多语种数学推理benchmark。研究发现，即使是目前最先进的LLM，如Qwen-3-235B-A22B-Thinking和Gemini-2.5-pro，也无法获得高分，表明LLMs在多语种推理中的挑战性仍然存在。控制输出语言可以改善推理性能，尤其对于低资源语言。
    model: llama3.2
