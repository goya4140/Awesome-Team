    summary_zh: 研究者探讨了语言图像预训练中长描述的重要性，发现每个句子都可能描述图像的一部分。他们提出了一个动态采样子句并引入组合损失的方法，实现了对比学习框架下使用长描述的有效性。实验结果表明，这种方法DreamLIP在多种下游任务上表现出优越性，甚至在图像-文本检索和语义分割任务上与CLIP训练的400M对相匹配或超越。
