    summary_zh: 研究者引入DAComp，一个模拟复杂企业数据智能流程的benchmark，评估数据工程和数据分析任务。结果表明，即使是最先进的机器人也难以通过DAComp，表明存在数据工程和分析两个领域都有严重不足。
