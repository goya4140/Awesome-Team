  amazon-agi-lab:1:
    abstract_sha256: 180f500c7ef1a35d43cce5ccf0f93f078c4c4043f651461a8fdc10ce25b3308b
    summary_zh: 我们提出了一种新方法来评估Retrieval-Augmented Large Language Models（RAG）的任务特异性准确度。该方法使用自动生成的多选题考试，基于与任务相关的文档集合，评估RAG的性能。我们的方法是一种自动化、成本效益、解释性和robust的策略来选择RAG系统的最佳组件。我们利用Item Response Theory（IRT）估计测试的质量和信息性，并提供了一个自然的方式来通过移除不够信息性的考试题来迭代改进测试。我们的方法在四个新开启的问答任务上进行了实验，包括Arxiv摘要、StackExchange问题、AWS DevOps troubleshooting指南和SEC文件。我们的实验结果表明，选择正确的检索算法往往比仅使用更大的语言模型来获得更大的性能提升。
    model: llama3.2
    generated_at: '2026-07-28'
  amazon-agi-lab:2:
    abstract_sha256: 033a49ae640cfb0c4239fb5c62129e8bf92c2d8fad5513b7c5f878980d29611f
    summary_zh: 研究问题是大型语言模型（LLM）在时间推理方面的局限性。该论文提出TISER框架，通过多阶段过程和测试时缩放来增强LMM的时间推理能力。实验结果显示TISER实现了多项benchmarks的最佳表现，并使小型开源模型能够超越大型闭量模型在复杂时间推理任务上取得突破。
    model: llama3.2
    generated_at: '2026-07-28'
