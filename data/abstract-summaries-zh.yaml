  ant-interactive-ai-lab:2:
    abstract_sha256: d71eedd5941b824f0044b43b3b9ccad3d31ffe2f954d911aaec63678d6484f3c
    summary_zh: 本 paper 提出了 PlanarSplatting，一个极快和精确的多视图室内图像重建方法。该方法利用 3D 平面作为主要目标，并开发了一个明确优化框架来将 3D 平面分割为 2.5D 深度和法向图。这种方法不依赖于 2D/3D 平面检测和匹配，以及平面重建的传统依赖关系。通过使用 CUDA 实现的计划 splatting 函数，该方法可以在 3 分钟内准确重建室内场景，并在大量场景上对 ScanNet 和 ScanNet++ 数据集进行量化评估，表明其优势。
    model: llama3.2
    generated_at: '2026-07-28'
  apple-machine-learning-research:0:
    abstract_sha256: b93bafc50bfe234dd3c35f26303504ff50bdf1b9e702960554296d83ab514690
    summary_zh: 研究者探讨了如何提高视觉语言模型（VLM）的性能，特别是在文本丰富的图像理解任务中。他们提出了FastVLM，该模型通过优化视觉编码器的效率和模型大小来实现最佳平衡。FastVLM使用FastViTHD，一个新式的混合视觉编码器，可以减少token数量并降低编码时间。实验结果表明，FastVLM在时间到第一个 token（TTFT）的速度方面取得了 3.2 倍的改进，同时保持了与其他方法相似的性能。
    model: llama3.2
    generated_at: '2026-07-28'
  apple-machine-learning-research:2:
    abstract_sha256: 27f279cac7396642c1052ca3ea807442e338ee81c60701f840f589f011ba7fb5
    summary_zh: 该研究提出了一个可以同时 modeling 对象几何和视觉依赖性表面颜色的 3D 隐式表示。通过利用 RGB-深度图像提供的表面光场样本，模型学习在统一的 3D 隐式空间中表示几何和颜色。这一表示可以重现复杂照明下 specular 高光和弗雷斯内射反射等视觉依赖性效果。实验结果显示，该方法比现有方法具有更高的可视质量和更好的输入准确度。
    model: llama3.2
    generated_at: '2026-07-28'
  berkeley-nlp:0:
    abstract_sha256: abc75ee55c7ac5992656dcec2106e286c670a58130a59b0eef7f5fd74d7496c5
    summary_zh: 研究表明，通用自动评估工具可以显著改善 web 导航和设备控制的代理人性能。通过实验，发现多种评估模型在不同权衡中取得了良好的结果，并且在几项流行的代理人benchmark上获得了74.4%至92.9%的 oracle 评估指标一致性。使用这些评估工具改进现有代理人，仅通过 fine-tuning 和实时指导就能提高 WebArena 基准的状态-of-the-art性能29%，并在设备控制设置中实现大约75%相对改善。
    model: llama3.2
    generated_at: '2026-07-28'
  berkeley-nlp:1:
    abstract_sha256: 9ad804a402cd0d273beee02d9af772f156ec77f982a68a7978c9fc043d8846e6
    summary_zh: 研究人员创建了一个数据集DTAiLS，包含9种语言的单词概念变异。他们评估了最近的语言模型和机器翻译系统，并发现GPT-4在67%至85%的准确率之间取得了最佳结果。使用语言模型生成目标语言概念变异规则后，弱化模型的准确度大幅提高，甚至超过GPT-4。
    model: llama3.2
