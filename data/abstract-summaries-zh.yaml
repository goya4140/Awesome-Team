  zju-3dv:1:
    abstract_sha256: d1974dddb534410c343958c9e75789c5af7579fbe3a7a720ce9d14e4a9adffa6
    summary_zh: 该研究提出了一个用于从单视图视频中恢复世界基准的人体运动的新方法。该方法使用一种名为Gravity-View（GV）的坐标系统，利用世界重力和相机视角来定义它。这导致了对学习图像姿势映射的错误积累的解决方案，并在实验中证明了其在摄像头空间和世界基准下的更真实运动恢复方面的优势。
    model: llama3.2
    generated_at: '2026-07-28'
  zju-3dv:2:
    abstract_sha256: 97f5140a93f6d0bf5fe04e351ebdb8219e1f1df9aaaca72c336acdb7193bd491
    summary_zh: 该研究旨在解决自主驾驶场景中动态城市街头的模型化问题。 recent方法通过将跟踪车辆姿势 incorporation 运用NeRF，实现动态城市街头场景的 photo-realistic 视觉合成。但是，这些方法存在显著限制，即训练和渲染速度较慢。该论文提出Street Gaussians，一个新的隐式场景表示方法，解决这些限制。该方法将动态城市街头表示为一组点云，每个点云与语义标签和3D高斯分布相关联，分别对应于前景车辆或背景。该方法使用可调节跟踪姿势的对象点云，并结合4D球面谐波模型来模拟前景车辆的动态外观。这种隐式表示方法使得场景编辑和渲染在 135 FPS（1066×1600分辨率）内进行，仅在半小时的训练时间
    model: llama3.2
    generated_at: '2026-07-28'
  zju-nlp-kg:1:
