    summary_zh: 该研究旨在开发一种能够解码人类视觉神经表示的通用方法，称为BraVL。该方法利用多模态学习来结合脑、视觉和语言特征。通过使用混合-of-product-of-experts公式，BraVL模型可以推导出一个共享的隐式代码，使其能够生成所有三个模态的合一表示。实验结果表明，解码新类别的视觉活动是可行的，并且使用多模态特征的模型比单模态特征的模型更准确。
    model: llama3.2
