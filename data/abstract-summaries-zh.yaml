  shanghai-ai-lab-opendrivelab:0:
    abstract_sha256: 6d1c67b82646d332289fb959fe5fc1a815e35a9fefa9f82d7cbda8eb2a82031b
    summary_zh: 该研究旨在解决自主驾驶系统的关键问题，即在各种场景中学习合理的决策。然而，现有数据集主要由人类专家收集的有限场景组成，这导致了缺乏数据多样性。为了补充这种不足，我们开发了一种能够合成大量未知状态的可扩展模拟框架。该框架使用先进的神经渲染技术和反应环境来生成高真实度的多视图观察，控制这些新生成的轨迹。我们还开发了一个伪专家轨迹生成机制，这些新生成的状态为动作监督提供了支持。在合成数据上，我们发现使用现有数据集和模拟样本进行简单的共训练可以显著提高各种规划方法在挑战性真实世界benchmark上的性能，包括+8.6 EPDMS 在 navhard 和 +2.9 在 navtest。更重要的是，这种政策改进随着模
    model: llama3.2
    generated_at: '2026-07-28'
  shanghai-ai-lab-opendrivelab:1:
    abstract_sha256: 103134cdbf70f4500624a382e34a230b3fe12149c7034bbfdb93d8d9287f8f67
    summary_zh: 研究者开发了一个名为World Engine的框架，能够生成高真实度的交互环境，并在这些环境中训练自主汽车模型。通过这种方法，可以在安全性方面取得显著改进，减少安全性边界中的错误发生率。
    model: llama3.2
    generated_at: '2026-07-28'
  shanghai-ai-lab-opendrivelab:2:
    abstract_sha256: 67fed0b4726e6c9448bce7bfbde7310adba57017fda4d7654d655f2c496f067b
    summary_zh: 研究者提出了Rise框架，旨在通过想象力来实现机器人强化学习的可靠性。该框架结合了预测未来动态和评估想象结果的模型，能够在无需物理交互的情况下不断改进策略。实验结果表明，Rise在三项挑战任务上取得了显著的改善，尤其是在动态堆栈、背包装裹和箱子关闭等任务中。
    model: llama3.2
    generated_at: '2026-07-28'
  shanghai-ai-lab-opengvlab:0:
    abstract_sha256: 28ba24fedd92e6719f08e05f6e80f34cf6cb0beeb42fc1377784875c986a6844
    summary_zh: 该研究旨在解决长视频处理的挑战，提出了Hierarchical video token Compression（HiCo）方法和多阶段短到长学习方案。通过这些方法，研究者开发了VideoChat-Flash模型，表现出在主流长短视频benchmark上取得领先结果。
    model: llama3.2
    generated_at: '2026-07-28'
  sjtu-gair-nlp:0:
    abstract_sha256: 7eb9bdd730113260867582e2ad90a077371b04e04f64d5d921d85ba9ea5c788b
    summary_zh: 研究表明，复杂推理在大语言模型中不一定需要大量的训练数据。通过简单的监督 fine-tuning，LIMO模型可以获得63.3%的准确率和95.6%的准确率，并且在出于分布中的一般化方面表现出强大的能力。研究结果支持“Less-Is-More Reasoning Hypothesis”，即当基础模型中已有充分的知识编码时，通过少量但策略性的示例来引导推理可以获得复杂的推理。
    model: llama3.2
    generated_at: '2026-07-28'
  sjtu-gair-nlp:1:
    abstract_sha256: 6c82551e500055c10edbac67ea74263d66afb9135882cda79bb81e3fd91e8b6a
    summary_zh: 研究问题是目前的开源大型多模态模型面临的问题，包括缺乏 native 整合、单模态生成和依赖于 separate diffuser 模型。该论文提出了 Anole，这是一种 open、autoregressive 的 native 大型多模态模型，可以进行交替图像-文本生成。通过采用 Meta AI 的 Chameleon 和创新 fine-tuning 策略，Anole 展示了高质量和一致的多模态生成能力，并且开源了模型、训练框架和 instruction tuning 数据。
    model: llama3.2
    generated_at: '2026-07-28'
  sjtu-gair-nlp:2:
    abstract_sha256: aa93153a08162b908171020b358b94e6c51c2246d7b0ce3b033bb47479a60c2d
    summary_zh: 研究表明，即使使用小型语言模型（0.3B参数），它们也可以通过“编程每个例子”（ProX）框架有效地改善数据质量，超过人类专家和其他选择方法。实验结果显示，预训练于ProX优化的数据下，模型的性能大幅提高。
    model: llama3.2
    generated_at: '2026-07-28'
  sjtu-mifa:2:
    abstract_sha256: e4fa157116f76ce77bf565c8884ac41daea8bcf082633aed75d896f2b6e91877
    summary_zh: 研究者提出了一个称为RCAL的方法，旨在解决 noisy labels 和长尾数据的问题。该方法通过使用自主对比学习提取表示，并假设正确标签下的表示遵循多变量高斯分布，从而恢复受污染的表示并增加样本数量。实验结果表明RCAL方法可以有效改善分类器性能。
    model: llama3.2
    generated_at: '2026-07-30'
  sjtu-mint:2:
    abstract_sha256: 5d57a38d4272d53e6edf7318a41fd45148c794ccfd1f2706cf8896f610d6237a
    summary_zh: 该研究提出了一种轻量化的Vision-Language-Action（VLA）模型Evo-1，通过减少计算成本和提高部署效率，实现了强大的性能。Evo-1结合了多模态视觉语言模型和跨模态diffusion变换器，采用两阶段训练方法来优化表示。该模型在Meta-World和RoboTwin等suite上取得了state-of-the-art结果，并在实际应用中表现出高成功率和低内存占用。
    model: llama3.2
    generated_at: '2026-07-28'
  sjtu-rl2:2:
    abstract_sha256: 538feab7686de63624cbf000a6762f7b74df072433556140ce0708fd95c17a58
    summary_zh: 该研究提出了一种新的动作约束强化学习方法，通过将动作空间转换为其对应的双空间，并使用Dirichlet分布策略来保证严格约束满足，同时进行随机探索。实验结果表明该方法在benchmark环境和实际四肢行走任务中表现出更高的奖励和更快的推导速度，证明了该方法的有效性和潜在应用价值。
    model: llama3.2
    generated_at: '2026-07-28'
  stanford-iliad:0:
    abstract_sha256: 03270d42b61282000b8462d513ce2707172568a4bf73c692431128b3cf3a3973
    summary_zh: 研究问题是如何让人机交互设计出合适的奖励函数。该方法使用Gaussian Process模型，通过人类对动作序列的比较来学习奖励函数，不需要预先定义特定的结构或大量数据。实验结果表明这种方法可以有效地学习 robotics 任务的 expressive reward functions。
    model: llama3.2
    generated_at: '2026-07-28'
  stanford-iliad:1:
    abstract_sha256: 6ba7dcac3bb656385c853d68f17feb318f33904db416da47e033c27e21d1e990
    summary_zh: 研究者提出了一个新的机制——“赠送”（gifting），它允许在多个代理人之间形成更有利于社会的行为。通过理论框架和实验，研究者证明了赠送可以促进高风险、一般和分散的协调游戏向更有利于社会的平衡状态转变。
    model: llama3.2
    generated_at: '2026-07-28'
  stanford-iliad:2:
    abstract_sha256: c7d24e9a7bef5ba4125bc8056e8726032c8eec3d1f12b6108286a749afb18a8a
    summary_zh: 研究探讨了如何使用人机共主的方法来提供个性化的运动技能教育。该方法通过分析学生在自主机器辅助下行为改进的方式，确定哪些技能是最容易学习的。这项研究表明，该方法可以帮助学生提高驾驶速度、行为和平滑度。
    model: llama3.2
    generated_at: '2026-07-30'
  stanford-nlp:1:
    abstract_sha256: d75dadea5bc816f666f5cd939cdcaaf75f5b10990c88c66db90676f4e043cace
    summary_zh: 研究人员开发了一个名为pyvene的开源Python库，用于在多个AI领域中进行模型内部状态的干预。该库支持自定义干预方案，并且可以包含静态或可训练的参数。通过pyvene，可以实现对神经网络模型的统一和扩展性干预，共享干预结果并进行解释分析。
    model: llama3.2
    generated_at: '2026-07-28'
  stanford-svl:1:
    abstract_sha256: bf1c055f5ab1736e65d36eff5d1e5af5e777bded119569ea29e04f3c54da1aa7
    summary_zh: 该研究探讨了视频任务与单图的区别，提出了一个新的模型“时间点探针”（ATP），通过它发现理解事件时序性并不是必需条件来实现强或状态-of-the-art的性能。该模型可以改善视频语言数据集和模型设计，并且可以提高效率和性能。
    model: llama3.2
    generated_at: '2026-07-28'
  tencent-ai-lab:0:
    abstract_sha256: 592e2b3b91a080a6db4a9955795b444b2f1abf8d99bcea3ebd81b1bc8adcc893
    summary_zh: 本研究探讨了事件提取（Event Extraction，EE）任务的零-shot学习问题。该方法使用对比学习和温化阶段来将事件提取和定义语义融合到同一个空间中，从而实现有效的零-shot学习。实验结果表明，该模型在MAVEN数据集上显著优于之前的零-shot EE 方法，并且可以轻松应用于少样本设置，超越baseline的监督方法。
    model: llama3.2
    generated_at: '2026-07-28'
  tencent-ai-lab:1:
    abstract_sha256: 37e4209c8aeda156328ec51adcf0cdc88cdfcfc68f75180d3018d146fd913488
    summary_zh: 该研究探讨了如何将预训练的文本到图像diffusion模型转换为图像提示能力。研究人员提出了IP-Adapter，一个轻量化的适配器，可以在不需要大量计算资源的情况下实现图像提示功能。通过使用分离的交叉注意机制，IP-Adapter可以有效地将预训练的diffusion模型转换为图像提示能力，并且可以与其他基准模型、文本提示和结构控制相兼容。
    model: llama3.2
    generated_at: '2026-07-28'
  tencent-arc-lab:1:
    abstract_sha256: 2124d45fb5498a71fd96738d265fc9873494806e90d1c99d952db0985d4c2eeb
    summary_zh: 研究者提出了Pixal3D，一个能够生成高精度的3D模型的方法。该方法通过将图像中的特征直接投影到3D空间中，解决了2D-3D correspondence问题，从而实现了高精度的3D生成。
    model: llama3.2
    generated_at: '2026-07-28'
  tencent-arc-lab:2:
    abstract_sha256: 8d54aeaf65980cf1d8e93320b2ae60d9f4bd2a90a6792b3f29d07db7b9f09153
    summary_zh: 研究问题是如何改善图像填充模型的性能。该研究提出了一种新颖的方法，即将掩盖图像特征和噪声latent分离为两个独立支线，减少模型的学习负担。这导致了更细致入微地包含必要的掩盖图像信息。在本文中，提出了BrushNet模型，该模型可以在任何预训练的DM中嵌入pixel级掩盖图像特征，从而实现更加一致和高质量的图像填充结果。
    model: llama3.2
    generated_at: '2026-07-28'
  tencent-hunyuan:2:
    abstract_sha256: 101848855bef86d805f2c6bfe8c73d9ce601191261d5f34fdd10d7d1bd7b19a4
    summary_zh: HunyuanPortrait是一种基于diffusion的条件控制方法，能够实现高可控性和 lifelike 的portrait动画。该方法利用预训练编码器分离 portrait 动态信息和身份信息，并使用隐式表示作为控制信号。在实验中，HunyuanPortrait表现出强大的通用性能，可以有效分离外观和动态在不同图像风格下。
    model: llama3.2
    generated_at: '2026-07-28'
  tencent-youtu-lab:0:
    abstract_sha256: d5c04755ddc89244d54e074c210334c6824c14cd07dea9a52d8f5d4a7a66b944
    summary_zh: DepthCrafter是一种能够生成高详细度长深图序列的方法，适用于开放世界视频。该方法不需要额外信息，如相机姿势或光流来实现。通过设计的三阶段训练策略，DepthCrafter可以在一时间内生成长度可变的深图序列，直到110帧，并从现实和合成数据集中获取精确深度细节和丰富内容多样性。该方法也提供了处理极长视频的推断策略，通过段位估计和无缝接合来实现。
    model: llama3.2
    generated_at: '2026-07-28'
  tsinghua-coai:1:
    abstract_sha256: 39b55187a7573522f423a725ce2324539b86c0d59fc8f051cdd998768037a488
    summary_zh: 该研究提出了ShieldLM，一个基于大语言模型的安全检测器，可以根据不同标准检测安全性，并提供解释。通过实验结果表明，ShieldLM在多个测试集上优于强基线，表现出可定制化和解释能力。
    model: llama3.2
    generated_at: '2026-07-28'
  tsinghua-coai:2:
    abstract_sha256: 004ebf2594f873c5ad8db6fa57e924c60766076f320898f65dc38015b5e563e7
    summary_zh: 研究者提出ComplexBench，一个评估大型语言模型（LLM）复杂指令遵循能力的基准。该benchmark使用分类系统和高质量数据来评估LLMs在处理多个约束组成的复杂指令时的能力。结果表明，ComplexBench揭示了现有LLMs在处理复杂指令时存在显著缺陷。
    model: llama3.2
    generated_at: '2026-07-28'
  tsinghua-keg-thudm:0:
    abstract_sha256: 1ac333be4ca95512fff4a29690879803f2a707b7a3972c06bbe0e7bd8d7fdd73
    summary_zh: 现有长文本大语言模型（LLM）在处理长输出时遇到瓶颈，主要原因是训练数据中长输出的例子相对稀缺。该研究引入了AgentWrite管道，分解超长生成任务为小任务，从而使现有LLM能够生成超过20,000字的合理输出。通过构建LongWriter-6k数据集和LongBench-Write评估指标，研究者 successfully Scaling LLM 的输出长度至10,000字以上，同时保持输出质量。
    model: llama3.2
    generated_at: '2026-07-28'
  tsinghua-keg-thudm:1:
    abstract_sha256: 9869ebaf8c00c0bfc8d84d0e1bd20131e6db2f484a5714e106d39bb8ffb26457
    summary_zh: 该研究提出了一种称为ReST-MCTS*的强化学习方法，旨在通过集成过程奖励指导和树搜索MCTS*来收集高质量的推理轨迹和每步价值，以训练策略和奖励模型。结果表明，这种方法可以实现更高的准确率，并且可以连续改进多个语言模型，超越其他自我学习算法。
    model: llama3.2
    generated_at: '2026-07-28'
  tsinghua-keg-thudm:2:
    abstract_sha256: d4173e73fa7492b39be76ea72197a28c3aa25aac23e8bb782e94c956c20eb2ac
    summary_zh: 该研究提出了一种长文本对齐的方法，称为LongAlign。通过构建一个长指令遵循数据集、采用packing和排序批量策略以及平衡损失方法，实验结果表明LongAlign在长文本任务上出perform了现有方法，达到了30%的优势，同时保持对短指令任务的准确性。
    model: llama3.2
    generated_at: '2026-07-28'
  tsinghua-thunlp:0:
    abstract_sha256: e18972ca4d61ea7ee0550d496197fa5d3a1a546e234e0180a7186fce8732cd3c
    summary_zh: 研究人员探讨了大型语言模型的强化学习中是否需要增加复杂性。他们提出了一个简单的方法JustRL，使用单阶段训练和固定超参数，实现了两种1.5B计算量的推理模型（54.9%和64.3%平均准确率）在九个数学benchmark上的state-of-the-art表现，同时使用2倍的计算资源。
    model: llama3.2
    generated_at: '2026-07-28'
  tsinghua-thunlp:2:
    abstract_sha256: 18661ab9a42a32cccdf14fbb9e4a20ef82d28e5e346bb293f1e5b1fe662cd481
    summary_zh: 该研究旨在解决法律案件检索（Legal Case Retrieval，简称LCR）任务的两个主要挑战：现有工作主要关注案件之间的检索，使用长句子，这不符合实际场景；现有数据集规模有限，只有几百个查询，不足以满足现有的大数据需求。该研究提出了一种自动化方法来构建合成的查询候选对，并建立了最大的LCR数据集LEAD，超过现有数据集数百倍。实验结果表明，使用我们的构造数据，可以实现现有两个广泛使用的LCRbenchmark的最佳结果。此外，该方法也可以应用于民事案件，取得了令人满意的效果。
    model: llama3.2
    generated_at: '2026-07-28'
  ucsd-existential-robotics:0:
    abstract_sha256: 914e55a4f9cc139f1465c7f51e9b64230b86ef0df99664595da37af603f47c43
    summary_zh: 该研究表明，使用3D隐形地图的移动操作策略可以比仅依靠图像实现更强大的空间和时间推理。该方法 Seeing the Bigger Picture（SBP）通过直接在3D隐形地图上进行端到端的学习来实现，这个地图可以扩展感知范围，聚合观察结果在长时空内。实验结果表明，SBP能够在场景级别移动操作和序列性桌面操作任务中表现出更强大的全球推理能力、长时空记忆和图像基于策略的优越性。
    model: llama3.2
    generated_at: '2026-07-28'
  ucsd-existential-robotics:1:
    abstract_sha256: 694da62c7f1121a188fb7b6e8fca44fb1660259036260528b2c97a21a4efa786
    summary_zh: 该研究引入了一种规划神经操作器（Planning Neural Operator，PNO），用于预测运动规划问题的值函数。该模型将值函数估计重写为从成本函数空间到值函数空间的单个操作，从Eikonal部分微分方程（PDE）定义。因此，PNO模型尽管在有限样本下训练，但具有神经操作器的零-shot超解析性。研究表明，该模型在MovingAI lab 2D城市数据集上准确估计值函数，且在3D场景中与现有神经值函数预测器进行比较。在4DOF机器人手臂上展示了优质的规划。
    model: llama3.2
    generated_at: '2026-07-28'
  ucsd-existential-robotics:2:
    abstract_sha256: 5717b7b1dd52dc637ab3d5d9de0c36dee9b22a071a4c077ff473f1b1756abf4f
    summary_zh: 研究者提出MISO（多层级优化方法），一种利用多分辨率子图的方法，来解决大环境中神经隐式表示SLAM的优化问题。该方法通过使用多层级优化方案和学习初始化来减少局部SLAM的计算时间，并且通过对多分辨率子图进行对齐和融合来提高全局一致性，进而显著提高神经签度函数SLAM的计算效率和估计精度。
    model: llama3.2
    generated_at: '2026-07-28'
  uiuc-secure-learning-lab:0:
    abstract_sha256: 0af3558c957de408d4d4ade3d7c3ecc76077880def5bb11fac7f62a010b90d47
    summary_zh: 该研究提出了AgentPoison，一个针对LLM agents的红队攻击方法，通过污染其长期记忆或知识库来实现安全性和可信度的侵蚀。实验结果表明，AgentPoison在攻击三个现实世界的LLM agent中成功率高达80%以上，并且对正常性能的影响较小。
    model: llama3.2
    generated_at: '2026-07-28'
  uiuc-secure-learning-lab:1:
    abstract_sha256: 634711015fc03894770ec1d45576c11fc0b983ae200e3df7fb992e21b1217515
    summary_zh: 该研究探讨了如何生成合理的隐私保护文本数据。现有的方法需要使用大型语言模型（LLM）进行微调以获得隐私保护的文本数据。然而，这种方法对于商业性质的LLM和开源LLM来说不适用，而且计算资源消耗较多。该研究提出了一个名为Aug-PE的增强Private Evolution（PE）算法，用于生成具有形式隐私保护（Differential Privacy, DP）的文本数据。该算法仅依赖于语言模型的API接口，并且不需要进行任何模型训练。通过对三个benchmark数据集的实验，研究结果表明Aug-PE能够产生具有竞争性高的DP合理文本数据，这意味着仅靠LLM的API接口就可以生成高质量的隐私保护文本数据，从而为更广泛的隐私保护语言模型应用提供了便捷途径。
    model: llama3.2
    generated_at: '2026-07-28'
  uiuc-secure-learning-lab:2:
    abstract_sha256: d04036bbe90b64bee5e589d9992e6c4bb6cf9e6777aa26999ffd8ffba5eb8a41
    summary_zh: 研究者开发了 UDora框架，旨在利用大型语言模型（LLM）进行红队攻击。该框架通过分析任务的推理过程，并在关键点处插入恶意扰动，导致LLM模型执行恶意行为或触发特定工具。实验结果表明UDora比现有方法更有效。
    model: llama3.2
    generated_at: '2026-07-28'
  ustc-mei-lab:0:
    abstract_sha256: 8db1843760f93c0a0deab10f469c40d344f0bf7fdba61eb5376f4898f2dbfe2e
    summary_zh: 研究者提出了一个新的Bayesian Window Transformer，通过引入概率分布来实现窗口的动态调整，从而克服传统Transformer的局限性。该方法不仅保留了Transformer强大的表达能力，还维护了翻译变异性和局部关系的重要性。实验结果显示，该方法在多种图像恢复任务中表现出突出的效果。
    model: llama3.2
    generated_at: '2026-07-28'
  ustc-mei-lab:2:
    abstract_sha256: e5fd81ced10bbb9364f9085b1f7498aebdcfe8eb70fbc1f9a119689f9e712c9a
    summary_zh: 该研究提出了一种称为Auto-Regressive 扩散（AR-扩散）的新模型，旨在解决视频生成任务中的两个主要问题：异步模型的不一致性和同步模型的序列长度限制。通过结合自动回归和 diffusión 模型，AR-扩散可以实现 flexible、异步视频生成，并且能够保持时间连贯性。实验结果表明，该方法在四个挑战性benchmark上取得了竞争性和领先性的成果。
    model: llama3.2
    generated_at: '2026-07-30'
  xiaohongshu-firered:0:
    abstract_sha256: 601aac431d7c73e77425359914d59422d11a0a676156bc346bcfb6a48a2567bb
    summary_zh: 研究者提出了InstanceAssemble模型，利用instance-assembling attention来控制图像的布局和多模态内容。该模型通过轻量化LoRA模块适应现有DiT-based T2I模型，并引入Layout 对齐 Score（LGS）评估指标。实验结果显示，该模型在复杂布局条件下实现了state-of-the-art性能，兼容多种样式的LoRA模块。
    model: llama3.2
    generated_at: '2026-07-28'
  xiaohongshu-firered:1:
    abstract_sha256: 918419b19d085ffea1cad48528b59993876a2cd442bf85a7d08497baddb529e9
    summary_zh: ReMatch是一种框架，利用MLLM的生成能力进行多模态检索。它通过将MLLM的embedding阶段与chat-style的生成匹配阶段结合起来，实现了instance-wise的判别监督和强化对难题负面样本的梯度。该方法在Massive 多模态 Embedding 基准（MMEB）上取得新高的表现，并在五个数据集上显示出强大的零-shot generalizeization结果。
    model: llama3.2
    generated_at: '2026-07-28'
  xiaomi-embodied-intelligence:2:
    abstract_sha256: 87bbccc85d0cd45c5e0178d907d8149c697b60ef9a3d391bb9d63ddc91cea741
    summary_zh: 研究者提出了MiMo-7B，一个专门用于解决推理任务的大型语言模型。通过优化预训练和后训练阶段，MiMo-7B表现出出色的推理能力，尤其是在数学、编程和一般推理任务上。该模型在测试中超越了更大的32B模型，并且经过RL训练后的版本MiMo-7B-RL也取得了突破性成果。
    model: llama3.2
    generated_at: '2026-07-28'
  xiaomi-mimo:1:
    abstract_sha256: 87bbccc85d0cd45c5e0178d907d8149c697b60ef9a3d391bb9d63ddc91cea741
    summary_zh: 研究者提出了一种名为MiMo-7B的语言模型，专门用于解决推理任务。该模型在预训练和后训练阶段进行优化，并通过多步骤的数据混合策略和测试难度驱动的代码奖励方案来改善推理能力。结果表明，MiMo-7B-Base具有出色的推理潜力，超越了更大的32B模型，而RL-tuned模型MiMo-7B-RL在数学、代码和一般推理任务上表现出色，超过了OpenAI o1-mini的性能。
    model: llama3.2
    generated_at: '2026-07-28'
  zhipu-glm:2:
    abstract_sha256: 0dda50a1c1cf24ca5ee62e521998fc724b3d3b3ab2f417c770b453cabd9ce9e0
    summary_zh: 研究者提出了一种名为SCAIL的框架，旨在解决控制性人形动画达到Studio级标准的挑战。该框架通过创新3D姿势表示和全文本姿势注入机制，实现了对复杂动作和跨身份动画的有效处理。实验结果表明，SCAIL取得了State-of-the-Art的表现，推进人形动画控制向Studio级标准的进展。
    model: llama3.2
    generated_at: '2026-07-28'
  zju-3dv:0:
    abstract_sha256: b90f2781f46c82ee282edb6a055bda4883f752b1e751515ab645cd77237087c5
    summary_zh: 该研究旨在实现高分辨率和实时的动态3D场景视图合成。通过提出的4K4D点云表示，该方法可以有效提高渲染速度，并且能够实现高质量的渲染效果。实验结果表明，该方法在1080p分辨率下可达400FPS，在4K分辨率下可达80FPS，显著超越了之前的方法，并达到当前最佳的渲染质量。
    model: llama3.2
