    summary_zh: 面部反欺骗技术对于防止面部识别系统受到安全侵害至关重要。近年来，面部反欺骗benchmark数据集的可用性取得了显著进展。但是，现有的面部反欺骗benchmark数据集的主体人数和模态数量有限（人数不超过170人，模态不超过2），限制了学术界进一步发展的能力。为了促进面部反欺骗研究，我们推出了一大规模多模态数据集，称为CASIA-SURF，是目前公众可用的面部反欺骗数据集中最大的，包含1000名主体，21,000个视频，每个样本都有3种模态（即RGB、深度和IR）。我们还提供了全面评估指标、多种评估协议、训练/验证/测试子集以及测量工具，建立了一项新的面部反欺骗benchmark。另外
    model: llama3.2
