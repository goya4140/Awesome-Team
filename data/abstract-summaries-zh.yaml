    summary_zh: 研究人员通过调查AI/ML领域的顶级会议发表者（N=524人）来了解他们对AI使用的态度。结果显示，AI/ML研究人员高度信任国际组织和科学组织，中等信任西方技术公司，但低信任国家军事、中国技术公司和Facebook。调查结果表明，AI/ML研究人员大多数不支持 lethal autonomous weapons，但对其他军事应用的AI持更积极态度。此外，大多数人认为AI安全研究应优先，并支持ML机构进行预发表审查，以评估潜在危害。
    model: llama3.2
