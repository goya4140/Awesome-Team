    summary_zh: 该研究引入了GUI-G$^2$奖励框架，利用Gaussian分布模拟人工点击行为，改善GUI grounding任务的性能。通过实验结果表明，GUI-G$^2$在ScreenSpot、ScreenSpot-v2和ScreenSpot-Probenchmark上显著优于现有方法，尤其是在ScreenSpot-Probenchmark上的改进率达24.7%。
    model: llama3.2
