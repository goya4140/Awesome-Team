  casia-brain-ai:0:
    abstract_sha256: 971e0e2ba7442434f29345bde919d355755e3942bbbd4ce83582c2a5546e1332
    summary_zh: 研究者开发了一种基于连接性的分区框架，利用非侵入性多模态神经影像技术，创建了一个包含210个皮层和36个下丘脑区域的全脑分区图。该图提供了精细的、可验证的分区，并包含了解剖结构和功能连接信息。此外，它将分区结构与心理过程进行了对应，提供了一个稳定的起点来探索结构-连接-功能之间复杂关系，从而改善了解人类脑部如何工作。
    model: llama3.2
    generated_at: '2026-07-30'
  casia-brain-ai:1:
