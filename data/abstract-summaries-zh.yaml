    summary_zh: Uni3C是一种统一的3D增强框架，旨在精确控制视频生成中的相机和人体运动。该框架通过两个关键贡献来实现这一目标：首先，提出了一个可插拔的控制模块PCDController，利用单眼深度图的未投影点云来实现精确的相机控制；第二，提出了一个统一的3D世界指引， seamless地整合景点点云和SMPL-X人体模型，以统一控制信号。Uni3C在相机控制和人体运动质量方面取得了显著的优势。
    model: llama3.2
