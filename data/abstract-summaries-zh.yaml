    summary_zh: 研究人员开发了一个名为LightMem的新记忆系统，旨在在Large Language Models（LLMs）中有效利用历史互动信息。该系统通过三个阶段实现，包括感知式感知、主题相关短期记忆和长期记忆。实验结果表明，LightMem在QA准确率、token使用量和API调用数量方面都取得了显著改进。
    model: llama3.2
    generated_at: '2026-07-28'
  zju-nlp-kg:2:
    abstract_sha256: 8876154a07f0e8f8d6d16c2a0585bb7c47944e14fa422568cbd6afb0dd75aca2
    summary_zh: 研究问题是机器写作中使用大型语言模型的检索增强方法，限制了生成具有丰富信息的内容。 OmniThink 是一种慢思考的机器写作框架，模拟人类学习过程中的逐步深化知识。实验结果表明，OmniThink 提高了生成文章的知识密度，而不会损害逻辑一致性和深度。
    model: llama3.2
    generated_at: '2026-07-28'
  zju-real:0:
