    summary_zh: 研究者提出了一种称为TangoFlux的高效的文本到音频（TTA）生成模型，能够在3.7秒内使用单个GPU生成30秒的44.1kHz音频。该模型通过一种名为CRPO的框架来优化偏好数据，从而改善TTA对齐。研究结果表明TangoFlux在多种评估标准下达到了先进水平。
    model: llama3.2
    generated_at: '2026-07-28'
  ntu-declare:1:
    abstract_sha256: db5269cda7a1cf4a49764e2661102eca3e3544cd25e5ad9e2e6c0b482168ea11
    summary_zh: 研究者提出了两个frame采样策略，MDF和MIF，以优化video question-answering模型的性能。这些策略通过最大限度地保留关键帧来减少关键帧 omission的风险，并且在实验中证明了其有效性。
    model: llama3.2
    generated_at: '2026-07-28'
  nus-ai-lab:0:
    abstract_sha256: 7ce0408958d9e3ca3aef34aa1852cca54acfe1a79e0246c62a27feaafb2345e6
    summary_zh: 研究探讨了缺失值对决策的影响，发现缺失值如果是由于非随机原因引起的，单纯增加样本大小不足以纠正偏差。该研究提出了 Monte CarloLikelihood方法来纠正偏差，并表明这种方法具有更好的性能。结果建议采取有效数据收集流程、记录可能原因、谨慎采用缺失值处理方法和结构化缺失值报告实践。
    model: llama3.2
    generated_at: '2026-07-28'
  nus-nlp:0:
    abstract_sha256: 8b763404362b18a58c58dbc9b5bfe2e311468b073596026f511d883f85940c89
    summary_zh: 研究者提出了一种新颖的任务，即根据用户的偏好条件生成幻灯片。他们提出了一个人行为 Inspired 的框架，SlideTailor，可以逐步生成可编辑的幻灯片，以满足用户的需求。该框架利用自然而易于提供的artifact来隐含地编码用户偏好，并且有效地将这些偏好 distilled 和 generalization 到指导定制幻灯片生成。
    model: llama3.2
    generated_at: '2026-07-28'
  nus-nlp:1:
    abstract_sha256: 40cd4b695509b8bb1c9ca9530e72336b11d1af052a3700ccf03c4e97264ee2e0
    summary_zh: 研究人员探讨了视频理解中的时间定位和文本回应的关系，发现时间定位是文本回应的基础。他们提出了D$^2$VLM框架，将学习这两个任务分离出来，并引入了一种新的优化算法FPO，以便于同时优化时间定位和文本回应。实验结果表明，这个方法比传统方法更有效。
    model: llama3.2
    generated_at: '2026-07-28'
  nus-nlp:2:
    abstract_sha256: e86d843dcbf547ffbf6bf753271a9946727b85a9fd6023f389f8c61abcdd12f5
    summary_zh: 研究人员提出了GRECO（质量估计模型），一个新型的质量估计模型，能够更好地评估语法错误校正结果的质量。通过使用GRECO，组合多个语法错误校正系统可以获得更高的F0.5分数。
    model: llama3.2
    generated_at: '2026-07-28'
  nvidia-cosmos-lab:0:
    abstract_sha256: '094c83445e59e68841c6a331a9fd7b7c2f43fb01eb625862688da595c1e80b49'
    summary_zh: 基础Pose是一种统一的基础模型，支持6D物体位置估计和跟踪，适用于基于模型和无模型的设置。该方法可以在测试时立即应用于新物体，无需重复训练，只要提供CAD模型或少量参考图像就足够。通过统一框架，下游位置估计模块在两种设置中相同，使用神经隐式表示进行高效的新视图合成。当没有CAD模型时。该方法通过大规模合成训练、语言模型、大型变换器结构和对比学习公式实现强大的普遍性。
    model: llama3.2
    generated_at: '2026-07-28'
  nvidia-cosmos-lab:1:
    abstract_sha256: 4d67c2df74c657bed16b6b5c1ac3bd49913736e7ff8693e6db2485e82322fe6b
    summary_zh: 研究者开发了基础Stereo模型，旨在实现强大的零shot泛化能力。该模型通过构建大规模的合成数据集和自适应的优化管道来获得强大的鲁棒性和精度。结果表明，该模型在不同域上表现出强大的零shot泛化能力，建立了新标准。
    model: llama3.2
    generated_at: '2026-07-28'
  nvidia-cosmos-lab:2:
    abstract_sha256: 38ed3f70693365d6ebccf2e916b5bce004640d57f27d89436f65550683e10e56
    summary_zh: 该研究提出了MambaVision，一个专门设计的Mamba-Transformer骨架，用于视觉应用。通过综合性分析，发现将Mamba与视觉变换器（ViT）结合起来可以显著提高其处理长距离空间依赖性的能力。MambaVision模型在ImageNet-1K数据集上的分类任务表现出SOTA的性能，并在其他下游任务如检测、分割等方面也取得了优异的结果。
    model: llama3.2
    generated_at: '2026-07-28'
