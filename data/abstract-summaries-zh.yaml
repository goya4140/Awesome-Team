    summary_zh: 研究问题是如何在实际场景中保持一致的编辑。Edicho提出了一个基于diffusion模型的无需训练的解决方案，利用明确的图像对应性来指导编辑。该方法结合了注意力操纵模块和精心调节的分类器-free guidance denoising策略，能够在不同环境下实现一致的跨图像编辑。
