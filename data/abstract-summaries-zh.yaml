  openai-research:2:
    abstract_sha256: 7a75eee03a45b59314f97ce8193c784ed719e389362f1a55572ee3db5db8f4c4
    summary_zh: 该研究探讨了长时间运行的智能代理在有限活动环境下如何保持稳定性。研究重点不仅是模型质量，还是在中间层次上研究如何让代理维持、退役、替换、压缩、分支和重置竞争性的假设或路线总结。该框架将搜索状态表示为一个被分成粗糙家族的活跃假设组合，各个项目都包含了承诺、验证延迟、保留成本、老化、重叠负担和 inertia。研究的关键贡献是建立了一种适当性语义：在每个鉴别窗口中，系统与一个非空随机集合相关联，这个集合由现实初始信息状态和下游随机性的实现所诞生。成功定义为在第一阶段强烈鉴别的验证阶段中至少保留一个适当家族的recoverability，避免依赖于选择器定义的伪真。研究
    model: llama3.2
    generated_at: '2026-07-28'
  pku-alignment:0:
    abstract_sha256: 78e86046c8e42f679c6d5b5d52aa1689d340ac9ed927d00639a903255580db7e
    summary_zh: 该研究开发了一个名为Aligner的模型无关的对齐方法，旨在解决大型语言模型（LLM）快速迭代和有效对齐的挑战。通过学习偏好答案与不受欢迎答案之间的纠正余数，Aligner可以直接应用于各种开源和API模型，只需进行一次训练。实验结果表明，Aligner在11种不同LLM上获得了平均改进68.9%的有用性和23.8%的无害性，同时有效减少幻听。
    model: llama3.2
    generated_at: '2026-07-28'
  pku-alignment:1:
    abstract_sha256: 31acff15e7e520cf820d028269c0cb4cca46925f48e471817642933b19cbe81e
    summary_zh: 该研究探讨了如何在视觉-语言-行动模型（Vision-language-action models，VLAs）中明确地整合安全约束。研究人员提出了一个集成安全方法（Integrated Safety Approach，ISA），通过系统地建模安全要求、激活多种不安全行为，并使用安全强化学习来有效地约束VLA政策，从而在严格的评估下确保其安全性。
    model: llama3.2
    generated_at: '2026-07-28'
  pku-alignment:2:
    abstract_sha256: 1030f3f3f96e15a7893c3e6d1998c2624ede0a7036238650805a31e0acb97ecb
    summary_zh: 该研究旨在解决RL在实际应用中的安全性问题。SafeDreamer算法通过将Lagrangian方法整合到世界模型规划过程中，实现了近零成本的性能，在Safety-Gymnasiumbenchmark上取得了成功。
    model: llama3.2
    generated_at: '2026-07-28'
  pku-camera-intelligence:2:
    abstract_sha256: 6364fe1be0017931d8e08aeaaadac4c76fe2f956afdce3f5685a1e8c094ee48a
    summary_zh: 该研究探讨了事件摄像技术在图像和视频增强方面的应用，利用事件摄像器来超越传统帧基准摄像器的优势。研究重点是五个事件辅助图像/视频增强任务（即事件基于视频重建、事件辅助高帧率视频重建、图像去雾、图像超分辨率和高动态范围图像重建），并提供了不同事件属性的影响分析、一个真实捕获的标签数据集以及对主流事件模拟器的评估。
    model: llama3.2
    generated_at: '2026-07-28'
  pku-core:0:
    abstract_sha256: cb11ba0affb1fa8d8a2d58e21ed6ec1c57d9e9dafa10a50d23ec9e2d96ceed74
    summary_zh: 研究者开发了TongGeometry，一个能够发现和证明奥林匹克级几何定理的神经符号系统。通过使用指导树搜索，TongGeometry在同等计算资源下建立了更大的几何定理库，并且在国际数学奥林匹克竞赛中获得了成功。
    model: llama3.2
    generated_at: '2026-07-28'
  pku-dair:1:
    abstract_sha256: bcc6e4965104c1e5ce2d4668deed14bf6f1f43b3d0f0d227865117b19a661d27
    summary_zh: 该研究提出了A-Tune-Online系统，旨在解决在线服务配置的自动化调优问题。系统通过多阶段检测策略和知识转移机制来实现高效、稳定和质量保证。实验结果表明A-Tune-Online比现有系统具有更好的性能和效率。
    model: llama3.2
    generated_at: '2026-07-28'
  shanghai-ai-lab-internlm:0:
    abstract_sha256: 45720d08d4b2cc599d181cf2870a4e404389091162bc6bfe83c9cac76b8fc803
    summary_zh: 研究问题是如何在科学领域实现高性能的多模态基础模型。该模型Intern-S1-Pro首次实现一万亿参数的规模，强化了一般和科学领域的能力，并扩展了专门任务的科学专业能力。通过 XTuner 和 LMDeploy 的支持，模型能够有效地进行强化学习训练并保持精确性。
    model: llama3.2
    generated_at: '2026-07-28'
  shanghai-ai-lab-internlm:1:
    abstract_sha256: 39cd11afe47ccbaa4379e04743d3aba9e7f56886f6ff562320c126f295c92bba
    summary_zh: 现有的大型视觉语言模型在文本级别的推理和自校正方面表现出突出的能力，但在视觉感知中心的复杂任务中，例如图表解析，仍然面临挑战。该研究提出了一种新颖的方法称为 Visual Self-Refine（VSR），它使模型能够生成像素级定位输出、可视化它们，然后将这些可视化反馈回自身，以便自我检查和纠正潜在的视觉感知错误。该研究在图表解析领域应用了 VSR 模式，提出了 ChartVSR 模型，该模型分为两个阶段：精确化阶段和解码阶段。
    model: llama3.2
    generated_at: '2026-07-28'
  shanghai-ai-lab-internlm:2:
    abstract_sha256: b8b7c46b9a7301883fa9ba3035210efa5b0a0797106fd904f0cc4969ab74c616
    summary_zh: 研究者提出了Endogenous Chain-of-Thought（EndoCoT）框架，旨在解决多模态大语言模型（MLLMs）在扩散框架中的两个关键问题。首先，它通过迭代性思考指导模块来激活MLLMs的推理潜力，然后将这些状态与Denoising 扩散 Transformer（DiT）的去噪过程连接起来，最后使用终止思考对齐模块确保推理轨迹在文本监督下保持稳定。通过大量实验，EndoCoT实现了平均准确度92.1%，超过强基线的8.3个百分点。
    model: llama3.2
    generated_at: '2026-07-28'
  shanghai-ai-lab-internscience:2:
    abstract_sha256: 23201e34991facfe2473d631b19413a74dedbb1ac871d39833c981115ec131ab
    summary_zh: InternAgent-1.5是一种统一的系统，旨在实现从头到尾的科学探索。该系统采用结构化的架构，包括生成、验证和演化三个子系统，支持深度研究、解决方案优化和长期记忆等核心能力。通过多个科学推理基准和两个类型的发现任务，InternAgent-1.5表现出强大的基础能力，并提供了一种广泛适用和可扩展的自主科学探索框架。
    model: llama3.2
    generated_at: '2026-07-28'
  shanghai-ai-lab-opendatalab:0:
    abstract_sha256: b4847b3ead9e03948ba876f2d7563455b70bfdb773de1f450ef072dda2db34a5
    summary_zh: 研究者推出OmniDocBench，一个新标准的benchmark，评估文档解析方法。该benchmark涵盖了多种文档类型和评估方式，包括19个布局类别和15个属性标签。结果表明，pipeline-based方法和end-to-end vision-language模型在不同文档类型上的强弱有所不同。
    model: llama3.2
    generated_at: '2026-07-28'
  shanghai-ai-lab-opendatalab:1:
    abstract_sha256: 19e21b26af6a50cf10219c2ceeab637e70dab7864f1f3821f9dedd4db7ab3341
    summary_zh: 以下是简要的 TL;DR： 研究问题：表格识别（Table Recognition，TR）旨在将表格图像转换为半结构化表示，如 HTML 或 Markdown。目前，TR主要依赖于监督学习，但需要大量标签数据，这使得开源模型难以与商业模型相比。 核心方法：TRivia是一种自-supervised fine-tuning方法，可以让预训练的视觉-语言模型（VLM）直接从未标记的表格图像中学习。该方法使用问答机制和注意力引导模块来生成问题，并通过回答问题得分来提供反馈，促进TR模型自主地学习识别、结构化和推理表格。 主要实验结论：TRivia-3B是一种开源的、紧凑且领先的TR模型，它在三项流行基准上超过了现有系统（例如Gemini 2.5 Pro、MinerU2.5）。
    model: llama3.2
    generated_at: '2026-07-28'
  shanghai-ai-lab-opendatalab:2:
    abstract_sha256: 8527f9bbccabe12d356a73dc719f107bd570b838c1312142e973324c9487706d
    summary_zh: 该研究从逆渲染的角度重新探讨了文档OCR，认为左到右的因果生成是序列化的artifact，而不是任务本身。提出了MinerU-Diffusion框架，采用平行diffusion降噪下条件化来替代传统的自回归解码。实验结果表明，MinerU-Diffusion在稳定性和效率方面有显著改进，能够减少依赖语言先验并提高视觉OCR能力。
    model: llama3.2
