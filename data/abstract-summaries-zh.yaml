  alibaba-nlp:0:
    abstract_sha256: b0bbdd72ece2d7d9c32d26293157e0cd6b0b088b4bc5fceee2e80f8a02192881
    summary_zh: '以下是简要的 TL;DR : 研究问题：传统的Retrieval-Augmented Generation（RAG）方法难以有效处理视觉丰富的文档，导致信息理解和推理能力有限。现有的 benchmarks主要关注图像-based问答（QA），忽略了视觉文档中效率的检索、理解和推理挑战。 核心方法：我们提出了ViDoSeek.dataset和ViDoRAG框架，旨在评估RAG性能在视觉丰富文档上。ViDoRAG采用Gaussian Mixture Model（GMM）-based混合策略来有效处理多模态检索，并引入了迭代代理流程，以促进模型的推理能力。 主要实验结论：我们的方法ViDoRAG在竞争性基准 ViDoSeek上表现出显著优势，超过现有方法的10%。'
    model: llama3.2
    generated_at: '2026-07-28'
  alibaba-nlp:1:
    abstract_sha256: 983583f576b398f671bfc58a171be2a6486a5c9278b67be80aa5225a589e47b2
    summary_zh: 该研究提出了一种名为CHRONOS的方法，用于构建开源新闻时线总结。该方法通过反复询问和更新信息来聚集相关文档，并在每个轮次中生成基于文档检索的时间线总结。实验结果表明，CHRONOS不仅能够有效地处理开源时线总结，而且也与已有的闭域应用系统相比表现出相当好的效果。
    model: llama3.2
    generated_at: '2026-07-28'
  alibaba-nlp:2:
    abstract_sha256: eb70b39365ce813f97123e78ffeee0e740d6858c31f5faa5f60a5bababf6cc91
    summary_zh: 该研究旨在解决 Vision Large Language Models（VLLMs）在处理知识密集或需要实时信息的问题。研究者提出了一个方法来检测 VLLMs 的知识界限，从而可以更高效地使用 Retrieval Augmented Generation（RAG）技术。实验结果表明，该方法能够有效识别 VLLM 的知识界限，并且可以减少不必要的检索，同时保持或提高性能。
    model: llama3.2
    generated_at: '2026-07-28'
