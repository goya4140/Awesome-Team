    summary_zh: 该研究提出了一种两阶段的预训练方法，首先使用12M个自主操作视频进行图像到视频预训练，接着联合预测未来关键点轨迹。结果表明，该方法可以有效提高视觉框架预测和动作预测的性能，并且在同类数据集上超越了现有最佳模型。
    model: llama3.2
